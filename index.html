<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>분임 토론방</title>
<style>
:root{--pri:#2f5bd6;--pri-d:#2447ad;--bg:#f3f5fa;--bd:#d6dcec;--ok:#16915a;--warn:#c9741c;--tx:#1d2433;--mu:#69728a;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px}
button:hover{background:#eef2fc}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--pri-d)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.warn{background:#fff4e6;border-color:#f0c999;color:#8a4b0c}
button.danger{color:#b3261e}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea{resize:vertical}
label{display:block;font-weight:600;margin:12px 0 4px}
label.chk{display:flex;gap:8px;align-items:center;font-weight:500}
label.chk input{width:auto}
h1,h2,h3{margin:0 0 8px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.narrow{max-width:440px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row>input{flex:1}
.mu{color:var(--mu);font-size:.92em}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82em;background:#e8edf9;color:var(--pri-d);font-weight:600}
.pill.ok{background:#dff5e9;color:var(--ok)}
.banner{background:#fff4e6;border:1px solid #f0c999;color:#8a4b0c;padding:8px 12px;font-size:.9em;text-align:center}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--bd);margin:8px 0 12px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;white-space:nowrap;margin-bottom:-2px}
.tabs button.on{border-bottom-color:var(--pri);color:var(--pri);font-weight:700}
.gcard{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px;border-radius:12px;background:#fff}
.gcard b{display:block;font-size:1.1em}
.gcard span{color:var(--mu);font-size:.92em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#eef2fc;border:1px solid #cfd8f1;border-radius:99px;padding:3px 12px;font-size:.92em}
.chip.lead{background:#fff1c9;border-color:#f0d27a;font-weight:700}
button.chip{min-height:0;cursor:pointer;font-size:1.05em;padding:8px 16px}
.topic{background:#f0f5ff;border:1px solid #cdd9f7;border-radius:12px;padding:10px 14px;margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.topic b{color:var(--pri-d)}
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:12px 12px 0 0;padding:6px;position:sticky;top:0;z-index:5}
.tb button,.tb select{min-height:34px;padding:4px 9px;width:auto}
.tb .sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
.tb.off{opacity:.5;pointer-events:none}
.doc{background:#fff;border:1px solid var(--bd);border-top:0;border-radius:0 0 12px 12px;min-height:360px;padding:16px;outline:none;line-height:1.7;overflow-wrap:anywhere}
.doc[contenteditable=false]{background:#fafbfd}
.doc table{border-collapse:collapse;margin:8px 0;max-width:100%}
.doc td,.doc th{border:1px solid #777;padding:6px 10px;min-width:70px;vertical-align:top}
.doc th{background:#eef1f8}
.doc img{max-width:100%}
.doc h3{margin:12px 0 6px}
.doc p{margin:4px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.actions .grow{flex:1}
.srow{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;background:#fff}
.srow .info{flex:1;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gbox{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:12px;cursor:pointer}
.gbox:hover{border-color:var(--pri)}
.snip{color:var(--mu);font-size:.9em;max-height:4.5em;overflow:hidden}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw}
#toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(15,20,35,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{background:#fff;border-radius:14px;padding:14px;width:min(960px,100%);max-height:100%;overflow:auto}
.mt{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.dtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.dtools .sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--bd)}
.dtools .sw.on{box-shadow:0 0 0 3px var(--pri)}
canvas#cv{width:100%;border:1px solid var(--bd);border-radius:8px;touch-action:none;background:#fff;cursor:crosshair}
.present{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column}
.present[hidden]{display:none}
.pbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#1d2433;color:#fff;flex-wrap:wrap}
.pbar button{background:#2c3550;border-color:#3a4568;color:#fff}
.pbar .sp{flex:1}
.pbody{flex:1;overflow:auto;padding:28px 6vw 60px}
.pbody h1{font-size:calc(var(--ps) * 1.6);margin:0 0 6px}
.pbody .pm{color:var(--mu);font-size:calc(var(--ps) * .6);margin-bottom:8px}
.pbody .pt{font-size:calc(var(--ps) * .9);background:#f0f5ff;border-radius:12px;padding:10px 16px;margin:10px 0 18px;color:var(--pri-d);font-weight:700}
.pbody .doc{border:0;padding:0;font-size:var(--ps);min-height:0;background:none;line-height:1.65}
.pbody .doc td,.pbody .doc th{padding:8px 14px}
#printArea{display:none}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body.printing{background:#fff}
  .pr{page-break-after:always;color:#000}
  .pr:last-child{page-break-after:auto}
  .pr h2{font-size:20pt;margin:4px 0}
  .pr-ws{color:#666;font-size:10pt}
  .pr-mem{font-size:11pt;margin:4px 0}
  .pr-topic{font-size:13pt;font-weight:700;margin:6px 0}
  .pr .doc{border:0;padding:0;min-height:0;font-size:12pt;line-height:1.6}
  .pr .doc td,.pr .doc th{border:1px solid #000}
  .qrp{text-align:center;padding-top:30mm}
  .qrp h1{font-size:30pt}
  .qrp .qrbox{display:inline-block;margin:20px 0}
  @page{size:A4;margin:16mm}
}

/* ===== Pro UI upgrade ===== */
:root{--shadow:0 10px 30px rgba(29,36,51,.08);--soft:#f8faff;--pri2:#6b8cff}
body{background:radial-gradient(circle at 15% 0%,#eaf0ff 0,#f3f5fa 36%,#f7f8fb 100%)}
.wrap{max-width:1120px;margin:0 auto;padding:18px}.narrow{max-width:760px}.card{border:1px solid rgba(214,220,236,.9);border-radius:18px;box-shadow:var(--shadow);background:rgba(255,255,255,.96)}
.top{position:sticky;top:0;z-index:5;background:rgba(243,245,250,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 0;margin-bottom:14px}
h1,h2,h3{letter-spacing:-.03em}button{transition:.15s ease}button.pri{box-shadow:0 8px 18px rgba(47,91,214,.22)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border-radius:999px;background:#fff}.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill{border-radius:999px;padding:3px 9px;font-size:.85em;background:#eef2fc;color:var(--pri-d)}.pill.ok{background:#e9f8f1;color:var(--ok)}
.srow{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--bd);border-radius:16px;background:#fff;padding:14px;margin:10px 0}.row.wrap{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{border:1px solid var(--bd);border-radius:12px;padding:11px 12px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,91,214,.12)}
.home-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:stretch}.hero-card{background:linear-gradient(135deg,#ffffff,#f5f7ff);border-radius:22px;padding:22px}.hero-title{font-size:34px;margin:0 0 6px}.qr-stage{text-align:center}.qr-stage>div{display:inline-block;background:#fff;padding:16px;border-radius:22px;box-shadow:var(--shadow)}.code-big{font-size:24px;font-weight:800;color:var(--pri-d);letter-spacing:.04em}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.mini{padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--soft)}
#present{position:fixed;inset:0;background:#0f172a;color:#f8fafc;z-index:50}.pbar{display:flex;gap:8px;align-items:center;padding:12px;background:#111827;border-bottom:1px solid #334155}.pbar button{background:#1f2937;color:#f8fafc;border-color:#475569}.pbody{padding:28px;max-width:1100px;margin:0 auto;font-size:var(--ps,30px);line-height:1.55}.pbody .card{color:var(--tx)}
@media(max-width:760px){.home-hero{grid-template-columns:1fr}.hero-title{font-size:28px}.srow{display:block}.top{position:static}.wrap{padding:12px}}

</style>
</head>
<body>
<div id="app"></div>
<div id="present" class="present" hidden></div>
<div id="printArea"></div>
<div id="toast"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="hwpx-template.js"></script>
<script src="hwpx.js"></script>
<script>
/* ===================== 공통 도구 ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = c => String(c || '').trim().toLowerCase().replace(/[^a-z0-9가-힣_-]/g, '');
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
async function sha(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return 'x' + btoa(unescape(encodeURIComponent(s))); }
}

/* ===================== 데이터 계층 (Firebase 또는 로컬 연습 모드) ===================== */
const DB = (() => {
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.databaseURL && window.firebase) {
    firebase.initializeApp(cfg);
    const db = firebase.database();
    return {
      mode: 'firebase',
      watch(path, cb) { const r = db.ref(path); const h = r.on('value', s => cb(s.val())); return () => r.off('value', h); },
      get: p => db.ref(p).get().then(s => s.val()),
      set: (p, v) => db.ref(p).set(v),
      update: (p, v) => db.ref(p).update(v),
      remove: p => db.ref(p).remove()
    };
  }
  const KEY = 'wsdemo'; let watchers = [];
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const save = d => localStorage.setItem(KEY, JSON.stringify(d));
  const parts = p => p.split('/').filter(Boolean);
  const getAt = (d, p) => { const v = parts(p).reduce((a, k) => a == null ? undefined : a[k], d); return v === undefined ? null : v; };
  const setAt = (d, p, v) => {
    const ks = parts(p); let o = d;
    ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
    if (v === null || v === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v;
  };
  const fire = () => {
    const d = load();
    watchers.slice().forEach(w => { const s = JSON.stringify(getAt(d, w.path)); if (s !== w.last) { w.last = s; w.cb(JSON.parse(s)); } });
  };
  window.addEventListener('storage', e => { if (e.key === KEY) fire(); });
  return {
    mode: 'local',
    watch(path, cb) {
      const w = { path, cb, last: undefined }; watchers.push(w);
      setTimeout(() => { if (!watchers.includes(w)) return; const s = JSON.stringify(getAt(load(), path)); w.last = s; cb(JSON.parse(s)); }, 0);
      return () => { watchers = watchers.filter(x => x !== w); };
    },
    get: async p => getAt(load(), p),
    set: async (p, v) => { const d = load(); setAt(d, p, v); save(d); fire(); },
    update: async (p, v) => { const d = load(); for (const k in v) setAt(d, p + '/' + k, v[k]); save(d); fire(); },
    remove: async p => { const d = load(); setAt(d, p, null); save(d); fire(); }
  };
})();

/* ===================== 상태 ===================== */
const S = { code: null, meta: null, groups: {}, docs: {}, role: null, gid: null, me: null, view: 'home', tab: 'status', roomTab: 'mine' };
const app = $('#app');
const ws = p => `ws/${S.code}/${p}`;
let unsubs = [];
function connect(code) {
  S.code = code; unsubs.forEach(f => f()); unsubs = [];
  unsubs.push(DB.watch(`ws/${code}/meta`, v => { S.meta = v; onData(); }));
  unsubs.push(DB.watch(`ws/${code}/groups`, v => { S.groups = v || {}; onData(); }));
}
const glist = () => Object.entries(S.groups).map(([id, g]) => ({ id, ...g })).sort((a, b) => (a.order || 0) - (b.order || 0));
const mlist = g => Object.entries((g && g.members) || {}).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.o || 0) - (b.o || 0));
function membersText(g) {
  const ms = mlist(g), lead = ms.find(m => m.id === g.leader), rest = ms.filter(m => m.id !== g.leader).map(m => m.name);
  return [lead ? '분임장 ' + lead.name : '', rest.length ? (lead ? '분임원 ' : '') + rest.join(', ') : ''].filter(Boolean).join(' · ');
}
function modeBanner() { return DB.mode === 'local' ? '<div class="banner">⚠ 연습(로컬) 모드 — firebase-config.js 를 채우기 전에는 같은 브라우저의 다른 탭끼리만 연결됩니다.</div>' : ''; }
function onData() {
  if (S.view === 'room') updateRoom();
  else if (S.view === 'pick') { const a = document.activeElement; if (!a || a.tagName !== 'INPUT') renderPick(); }
  else if (S.view === 'admin' && S.tab === 'status') renderAdminBody();
  if (P.open) paintPresent();
}

/* ===================== 문서 정리(보안) ===================== */
const OK_TAGS = new Set('p div br b strong i em u s strike span font h1 h2 h3 h4 ul ol li table thead tbody tr td th img mark hr blockquote'.split(' '));
const DROP_TAGS = new Set(['script', 'style', 'iframe', 'object', 'embed', 'link', 'meta', 'svg', 'form', 'input', 'button', 'textarea', 'select', 'video', 'audio']);
function clean(html) {
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const root = doc.body.firstChild;
  (function walk(n) {
    [...n.childNodes].forEach(c => {
      if (c.nodeType === 3) return;
      if (c.nodeType !== 1) { c.remove(); return; }
      const t = c.tagName.toLowerCase();
      if (DROP_TAGS.has(t)) { c.remove(); return; }
      walk(c);
      if (!OK_TAGS.has(t)) { while (c.firstChild) c.parentNode.insertBefore(c.firstChild, c); c.remove(); return; }
      [...c.attributes].forEach(a => {
        const k = a.name.toLowerCase(), v = a.value;
        const ok = (k === 'style' && !/expression|url\(|javascript|@import/i.test(v)) || ['size', 'color', 'colspan', 'rowspan', 'alt'].includes(k) ||
          (k === 'src' && t === 'img' && /^(data:image\/(png|jpeg|gif|webp);base64,|https:\/\/)/i.test(v));
        if (!ok) c.removeAttribute(a.name);
      });
    });
  })(root);
  return root.innerHTML;
}
const textOf = html => { const d = document.createElement('div'); d.innerHTML = clean(html); return (d.textContent || '').replace(/\s+/g, ' ').trim(); };

/* ===================== 시작 / 홈 ===================== */
async function start() {
  const w = new URLSearchParams(location.search).get('w');
  if (w) { await openMember(norm(w)); return; }
  try { const a = JSON.parse(sessionStorage.getItem('wsAdmin') || 'null'); if (a && await adminEnter(a.code, a.pin, '', true)) return; } catch (e) { }
  new URLSearchParams(location.search).get('admin') === '1' ? renderAdminLogin() : renderHome();
}

function renderHome(msg) {
  S.view = 'home';
  const last = norm(localStorage.getItem('wsLastCode') || S.code || 'ws2026');
  const url = `${location.origin}${location.pathname}?w=${encodeURIComponent(last)}`;
  app.innerHTML = modeBanner() + `<div class="wrap narrow">
    <div class="home-hero">
      <div class="card hero-card"><h1 class="hero-title">분임 토론방</h1><p class="mu">QR만 띄워두면 참여자는 바로 입장하고, 모둠별 작업·공유·발표까지 한 번에 진행됩니다.</p>
        <div class="quick-grid"><div class="mini"><b>① 입장</b><br><span class="mu">QR 또는 코드</span></div><div class="mini"><b>② 모둠 작업</b><br><span class="mu">의견 작성·정리</span></div><div class="mini"><b>③ 발표</b><br><span class="mu">전체 화면 발표</span></div></div>
        <div class="card" style="margin-top:14px"><h3>참여자 입장</h3><label>워크숍 코드</label><input id="code" placeholder="안내받은 코드" value="${esc(last)}" autocapitalize="off"><p style="margin:12px 0 0"><button class="pri" id="goM" style="width:100%">입장하기</button></p><p class="mu" style="margin-bottom:0">QR로 접속하면 코드가 자동으로 적용돼요.</p></div>
      </div>
      <div class="card hero-card"><h3 style="margin-top:0">접속 QR 코드</h3><div class="qr-stage"><div id="homeQr"></div></div><p class="mu" style="text-align:center;margin:12px 0 4px">접속 코드</p><div class="code-big" style="text-align:center">${esc(last)}</div><p class="home-url">${esc(url)}</p><button id="copyHomeUrl" style="width:100%">주소 복사</button></div>
    </div>
    <p class="home-admin-link"><button id="adminOpen" class="link-btn">관리자 화면 열기</button></p>
  </div>`;
  makeQR($('#homeQr'), url, 260);
  if (msg) toast(msg);
  $('#goM').onclick = () => { const c = norm($('#code').value); if (!c) return toast('코드를 입력하세요'); localStorage.setItem('wsLastCode', c); memberEnter(c); };
  $('#code').onkeydown = e => { if (e.key === 'Enter') $('#goM').click(); };
  $('#copyHomeUrl').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('주소를 복사했어요'); } catch(e) { toast('주소를 선택해 복사해 주세요'); } };
  $('#adminOpen').onclick = () => { history.replaceState(null, '', `${location.pathname}?admin=1`); renderAdminLogin(); };
}

async function openMember(code) {
  const m = await DB.get(`ws/${code}/meta`);
  if (!m) { renderHome(); toast('열려 있는 워크숍을 찾을 수 없어요 (코드 확인)'); return; }
  const ps = periodState(m);
  if (ps !== 'open') { history.replaceState(null, '', location.pathname); renderHome(); toast(ps === 'before' ? `아직 열리지 않았어요 (${fmtT(m.openFrom)}부터)` : '접속 기간이 끝난 워크숍이에요'); return; }
  localStorage.setItem('wsLastCode', code);
  S.role = 'member'; S.meta = m; S.groups = (await DB.get(`ws/${code}/groups`)) || {};
  S.view = 'loading'; connect(code);
  let saved = null; try { saved = JSON.parse(localStorage.getItem('wsMe') || 'null'); } catch (e) { }
  const g = saved && saved.code === code && S.groups[saved.gid];

/* --- 편집기 --- */
let savedRange = null;
document.addEventListener('selectionchange', () => {
  const ed = $('#editor'); if (!ed) return; const s = getSelection();
  if (s.rangeCount && ed.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange();
});
function restoreSel() {
  const ed = $('#editor'); ed.focus(); const s = getSelection();
  if (savedRange && ed.contains(savedRange.startContainer)) { s.removeAllRanges(); s.addRange(savedRange); }
  else { const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
}
const editable = () => $('#editor') && $('#editor').contentEditable === 'true';
function cmd(c, v) {
  if (!editable()) return; restoreSel();
  document.execCommand('styleWithCSS', false, c === 'hiliteColor');
  document.execCommand(c, false, v || null); afterEdit();
}
function afterEdit() { const s = getSelection(); if (s.rangeCount && $('#editor').contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); scheduleSave(); }
function insertTable(r, c) {
  if (!editable()) return; let h = '<table id="__nt"><tbody>';
  for (let i = 0; i < r; i++) { h += '<tr>'; for (let j = 0; j < c; j++) h += (i === 0 ? '<th><br></th>' : '<td><br></td>'); h += '</tr>'; }
  restoreSel(); document.execCommand('insertHTML', false, h + '</tbody></table><p><br></p>');
  const t = $('#editor').querySelector('#__nt');
  if (t) { t.removeAttribute('id'); const cell = t.querySelector('th,td'); if (cell) { const rg = document.createRange(); rg.selectNodeContents(cell); rg.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); } }
  afterEdit();
}
function tblOp(op) {
  if (!editable()) return;
  const n = savedRange && savedRange.startContainer, el = n && (n.nodeType === 1 ? n : n.parentElement);
  const td = el && el.closest && el.closest('td,th');
  if (!td || !$('#editor').contains(td)) return toast('표 안의 칸을 먼저 눌러 주세요');
  const tr = td.parentElement, table = td.closest('table'), ci = [...tr.children].indexOf(td);
  if (op === 'ar') { const nr = tr.cloneNode(true); [...nr.children].forEach(c => { const nc = document.createElement('td'); nc.innerHTML = '<br>'; c.replaceWith(nc); }); tr.after(nr); }
  if (op === 'dr') { table.rows.length <= 1 ? table.remove() : tr.remove(); }
  if (op === 'ac') [...table.rows].forEach(r => { const c = r.children[ci]; if (c) { const nc = document.createElement(c.tagName.toLowerCase()); nc.innerHTML = '<br>'; c.after(nc); } });
  if (op === 'dc') { tr.children.length <= 1 ? table.remove() : [...table.rows].forEach(r => r.children[ci] && r.children[ci].remove()); }
  if (op === 'dt') table.remove();
  savedRange = null; scheduleSave();
}
function bindEditor() {
  const tb = $('#tb'), ed = $('#editor');
  ['mousedown', 'pointerdown'].forEach(ev => tb.addEventListener(ev, e => { if (!e.target.closest('select')) e.preventDefault(); }));

/* --- 저장·동기화 --- */
function setSaveState(t) { const e = $('#saveState'); if (e) e.textContent = t; }
function scheduleSave() { if (!R) return; R.lastTypeAt = Date.now(); clearTimeout(R.saveTimer); R.saveTimer = setTimeout(doSave, 700); setSaveState('저장 중…'); }
function doSave() {
  clearTimeout(R.saveTimer); R.saveTimer = null; const ed = $('#editor'); if (!ed || !editable()) return Promise.resolve();
  const html = ed.innerHTML; if (html === R.lastApplied) { setSaveState('저장됨'); return Promise.resolve(); }
  R.lastApplied = html; R.pending = null;
  return DB.update(ws('docs/' + S.gid), { html, editor: S.me.name, editorTs: Date.now() }).then(() => setSaveState('저장됨 ✓')).catch(() => setSaveState('⚠ 저장 실패 — 네트워크 확인'));
}
const flushSave = () => (R && R.saveTimer) ? doSave() : Promise.resolve();
window.addEventListener('beforeunload', () => { if (R && R.saveTimer) doSave(); });
function setEditor(html) { const ed = $('#editor'); if (!ed) return; ed.innerHTML = clean(html); R.lastApplied = html; R.pending = null; R.loaded = true; }
function applyDoc() {
  const ed = $('#editor'); if (!ed) return; const d = S.docs[S.gid], html = (d && d.html) || '';
  if (R.loaded && html === R.lastApplied) { updateBadge(); return; }
  const typing = document.activeElement === ed && Date.now() - R.lastTypeAt < 4000;
  if (R.loaded && (R.saveTimer || typing)) { R.pending = html; return; }
  setEditor(html); updateBadge();
}
function roomTick() {
  const ed = $('#editor'); if (!ed) return;
  const ps = periodState(S.meta); if (ps !== R.pstate) { R.pstate = ps; if (S.groups[S.gid]) updateRoom(); }
  if (R.pending != null && !R.saveTimer && !(document.activeElement === ed && Date.now() - R.lastTypeAt < 4000)) { if (R.pending !== R.lastApplied) setEditor(R.pending); R.pending = null; }
  updateBadge();
}
function updateBadge() {
  const d = S.docs[S.gid], b = $('#badge'); if (!b) return;
  b.textContent = (d && d.editor && d.editor !== S.me.name && Date.now() - (d.editorTs || 0) < 6000) ? `✏️ ${d.editor} 님이 입력 중…` : '';

function openDraw() {
  if (!editable()) return;
  const m = document.createElement('div'); m.className = 'modal';
  const cols = ['#111111', '#d32f2f', '#1a4fd6', '#16915a', '#e08a00'];
  m.innerHTML = `<div class="mbox"><div class="mt">그리기 <button id="dx">✕</button></div>
  <div class="dtools">${cols.map((c, i) => `<button class="sw ${i ? '' : 'on'}" data-col="${c}" style="background:${c}"></button>`).join('')}
    <button data-w="3">가늘게</button><button data-w="7">보통</button><button data-w="14">굵게</button><button id="er">지우개</button><button id="un">↶ 되돌리기</button><button id="cl">모두 지우기</button></div>
  <canvas id="cv" width="900" height="520"></canvas>
  <div class="actions"><span class="grow"></span><button id="dc">취소</button><button class="pri" id="di">문서에 넣기</button></div></div>`;
  document.body.appendChild(m);
  const cv = $('#cv', m), ctx = cv.getContext('2d'); let color = '#111111', w = 7, drawing = false, last = null; const hist = [];
  const blank = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }; blank(); ctx.lineCap = ctx.lineJoin = 'round';
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  const seg = (a, b) => { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drawing = true; hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 25) hist.shift(); last = pt(e); seg(last, last); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); seg(last, p); last = p; });
  ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => drawing = false));
  m.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { color = b.dataset.col; m.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); });
  m.querySelectorAll('[data-w]').forEach(b => b.onclick = () => w = +b.dataset.w);
  $('#er', m).onclick = () => { color = '#ffffff'; w = 24; m.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); };
  $('#un', m).onclick = () => { const h = hist.pop(); if (h) ctx.putImageData(h, 0, 0); };
  $('#cl', m).onclick = () => { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); blank(); };
  const close = () => m.remove(); $('#dx', m).onclick = $('#dc', m).onclick = close;
  $('#di', m).onclick = () => { const url = cv.toDataURL('image/png'); close(); restoreSel(); document.execCommand('insertHTML', false, `<img src="${url}" alt="그림"><p><br></p>`); afterEdit(); };
}

async function adminEnter(code, pin, title, silent) {
  if (!code || !pin) { toast('코드와 PIN을 입력하세요'); return false; }
  const m = await DB.get(`ws/${code}/meta`), h = await sha(code + ':' + pin);
  if (!m) {
    if (silent) return false;
    if (!title) { toast('새 워크숍이에요. 제목을 입력하세요'); return false; }
    if (pin.length < 4) { toast('PIN은 4자 이상'); return false; }
    await DB.set(`ws/${code}/meta`, { title, pinHash: h, leaderTopic: true, created: Date.now() });
  } else if (m.pinHash !== h) { if (!silent) toast('PIN이 맞지 않아요'); return false; }
  sessionStorage.setItem('wsAdmin', JSON.stringify({ code, pin }));
  S.role = 'admin'; S.meta = m || { title, leaderTopic: true }; S.groups = (await DB.get(`ws/${code}/groups`)) || {};
  S.view = 'loading'; connect(code); S.tab = Object.keys(S.groups).length ? 'status' : 'groups'; renderAdmin(); return true;
}

function blocksFromHtml(html) {
  const root = document.createElement('div'); root.innerHTML = clean(html);
  const blocks = []; let cur = null;
  const flush = () => { if (cur) { const t = cur.runs.map(r => r.t).join('').trim(); if (t) { cur.runs[0].t = cur.runs[0].t.replace(/^\s+/, ''); blocks.push(cur); } } cur = null; };
  const add = (t, b) => { if (!cur) cur = { type: 'p', runs: [] }; cur.runs.push({ t, b }); };
  const boldEl = n => /^(b|strong|th)$/.test(n.tagName.toLowerCase()) || /bold|[6-9]00/.test(n.style.fontWeight || '');
  function cellText(td) { return (td.innerText || td.textContent || '').replace(/\s*\n\s*/g, ' ').trim(); }
  (function walk(node, bold) {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) { const t = n.textContent.replace(/\s+/g, ' '); if (t.trim() || cur) add(t, bold); return; }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if (tag === 'br') { flush(); return; }
      if (tag === 'table') { flush(); blocks.push({ type: 'tbl', rows: [...n.rows].map(tr => [...tr.cells].map(td => ({ t: cellText(td), b: td.tagName === 'TH' }))) }); return; }
      if (tag === 'img') { flush(); blocks.push({ type: 'p', runs: [{ t: '[그림 — PDF 저장본에서 확인하세요]', b: false }] }); return; }
      if (tag === 'ul' || tag === 'ol') { flush(); let k = 1; [...n.children].forEach(li => { if (li.tagName.toLowerCase() !== 'li') return; cur = { type: 'p', runs: [{ t: tag === 'ul' ? '• ' : (k++) + '. ', b: false }] }; walk(li, bold); flush(); }); return; }
      if (/^(p|div|h[1-6]|blockquote|li)$/.test(tag)) { flush(); walk(n, bold || /^h[1-6]$/.test(tag) || boldEl(n)); flush(); return; }
      walk(n, bold || boldEl(n));
    });
  })(root, false); flush();
  return blocks;
}
async function exportHwpx(ids) {
  if (!window.JSZip || !window.HWPX) return toast('저장 라이브러리를 불러오지 못했어요 (인터넷 확인)');

    const data = { title: S.meta.title, groups: ids.map(id => { const g = S.groups[id]; return { name: g.name, members: membersText(g), topic: g.topic || '', blocks: blocksFromHtml(docs[id] && docs[id].html) }; }) };
    const zip = await HWPX.buildHwpx(JSZip, window.HWPX_TEMPLATE_B64, data);
    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/hwp+zip', compression: 'DEFLATE' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${S.meta.title}_${ids.length === 1 ? S.groups[ids[0]].name : '전체'}.hwpx`.replace(/[\\/:*?"<>|]/g, '_');
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('HWPX 파일을 저장했어요 (그림은 PDF로 확인)');
  } catch (e) { console.error(e); toast('HWPX 저장 중 오류가 났어요'); }
}
start();
</script>
</body>
</html>
