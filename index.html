<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c47b4">
<title>생각 모아 봄 · 분임토의 의견 모음</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%233a5bd9'/%3E%3Crect x='7' y='24' width='15' height='15' rx='3.5' fill='%23fff' opacity='.92'/%3E%3Crect x='26' y='24' width='15' height='15' rx='3.5' fill='%23fff' opacity='.6'/%3E%3Crect x='16.5' y='26' width='15' height='15' rx='3.5' fill='%2386e9bb'/%3E%3Cpath d='M24 24V14' stroke='%2386e9bb' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>

:root{
  --bg:#eceff6;--panel:#fff;--panel-2:#f8f9fc;--ink:#101828;--mu:#667085;--bd:#dde1ea;--bd-s:#eceff4;
  --pri:#3a5bd9;--pri-d:#2c47b4;--pri-s:#eef1fe;--ok:#0e8a5f;--ok-s:#e6f6ee;--warn:#b45309;--warn-s:#fff6e8;--dg:#c0392b;--dg-s:#fdeceb;
  --acc:#12a06a;--acc-d:#0c7d52;--acc-s:#e7f7ef;--acc-l:#86e9bb;
  --r:16px;--rs:11px;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.055);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3,h4{margin:0 0 6px;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
p{margin:6px 0}
.mu{color:var(--mu);font-size:.92em}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---------- 버튼 ---------- */
button{border:1px solid var(--bd);background:#fff;border-radius:var(--rs);padding:9px 14px;cursor:pointer;min-height:40px;font-weight:600;transition:.14s background,.14s border-color,.14s transform}
button:hover{background:var(--panel-2);border-color:#cbd2e0}
button:active{transform:translateY(1px)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--pri-d);border-color:var(--pri-d)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.ok:hover{background:#0b7350}
button.warn{background:var(--warn-s);border-color:#f0d3a6;color:#8a4b0c}
button.danger{background:#fff;border-color:#f0c7c2;color:var(--dg)}
button.danger:hover{background:var(--dg-s)}
button.ghost{background:transparent;border-color:transparent;color:var(--mu)}
button.ghost:hover{background:#e6e9f2;color:var(--ink)}
button.sm{min-height:32px;padding:4px 10px;font-size:.88em;border-radius:8px}
button.lg{min-height:52px;font-size:1.05em;border-radius:12px}
button:disabled{opacity:.42;cursor:not-allowed}
button.block{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btnrow .grow{flex:1}
.link{border:0;background:none;color:var(--pri);padding:2px;min-height:0;font-weight:700}
.link:hover{background:none;text-decoration:underline}

/* ---------- 폼 ---------- */
input,select,textarea{border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;background:#fff;width:100%;transition:.14s box-shadow,.14s border-color}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(58,91,217,.14)}
textarea{resize:vertical;line-height:1.6}
label{display:block;font-weight:700;margin:14px 0 5px;font-size:.93em}
label .mu{font-weight:500}
label.chk{display:flex;gap:9px;align-items:flex-start;font-weight:500;background:var(--panel-2);border:1px solid var(--bd-s);border-radius:var(--rs);padding:10px 12px}
label.chk input{width:auto;margin-top:3px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row>input,.row>select{flex:1;min-width:0}
.num{width:92px;flex:none;text-align:center}

/* ---------- 레이아웃 ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 56px}
.wrap.narrow{max-width:520px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--sh)}
.card.tight{padding:14px}
.card.flat{box-shadow:none;background:var(--panel-2)}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:4px}
.card-h h3{margin:0}
.sect{font-size:.78em;font-weight:800;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin:22px 2px 2px}
.hr{height:1px;background:var(--bd-s);margin:14px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.two{grid-template-columns:1fr}}

/* ---------- 상단 바 ---------- */
.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.appbar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--pri)}
.appbar .ttl{font-weight:800;line-height:1.2}
.appbar .sub{color:var(--mu);font-size:.84em}
.appbar .sp{flex:1}
.notice{background:var(--warn-s);border-bottom:1px solid #f0d3a6;color:#8a4b0c;padding:7px 12px;font-size:.88em;text-align:center}

/* ---------- 칩 / 배지 ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pri-s);border:1px solid #d3dbfb;color:var(--pri-d);border-radius:999px;padding:3px 11px;font-size:.86em;font-weight:700}
.chip.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.chip.gray{background:var(--panel-2);border-color:var(--bd);color:var(--mu)}
.chip.ok{background:var(--ok-s);border-color:#bfe6d3;color:var(--ok)}
.chip.warn{background:var(--warn-s);border-color:#f0d3a6;color:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.84em;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--panel-2);border:1px solid var(--bd);color:var(--mu)}
.badge.ok{background:var(--ok-s);border-color:#bfe6d3;color:var(--ok)}
.badge.live{background:var(--pri-s);border-color:#d3dbfb;color:var(--pri-d)}
.dot-l{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.people{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.person{background:var(--panel-2);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:.9em}
.person.lead{background:#fff6da;border-color:#f0dca0;font-weight:700}
button.person{min-height:0;font-size:1em;padding:9px 16px}
button.person:hover{border-color:var(--pri);background:var(--pri-s)}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--panel-2);border:1px solid var(--bd);border-radius:999px;margin:4px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 15px;white-space:nowrap;color:var(--mu);min-height:36px}
.tabs button:hover{background:#e6e9f2}
.tabs button.on{background:var(--pri);color:#fff}

/* ---------- 홈 ---------- */
.hero{text-align:center;padding:30px 0 6px}
.hero h1{font-size:clamp(26px,5vw,38px);margin-bottom:6px}
.hero p{color:var(--mu);margin:0}
.qrcard{background:var(--panel);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:var(--sh);display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media(max-width:640px){.qrcard{grid-template-columns:1fr;text-align:center;justify-items:center}}
.qrbox{background:#fff;border:1px solid var(--bd-s);border-radius:14px;padding:12px;line-height:0}
.qrbox img,.qrbox canvas{display:block;border-radius:6px}
.qrinfo{min-width:0}
.codebig{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(24px,4.6vw,34px);font-weight:800;letter-spacing:.06em;color:var(--pri-d);word-break:break-all}
.url{font-size:.86em;color:var(--mu);background:var(--panel-2);border:1px solid var(--bd-s);border-radius:9px;padding:7px 10px;word-break:break-all;margin:8px 0 10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media(max-width:720px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:13px 14px}
.step b{display:block;font-size:.95em}
.step span{color:var(--mu);font-size:.85em}
.step i{font-style:normal;font-size:.72em;font-weight:800;color:var(--pri);letter-spacing:.08em}

/* ---------- 분임 선택 카드 ---------- */
.glist{display:grid;gap:10px}
.gpick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
.gpick:hover{border-color:var(--pri);background:var(--pri-s)}
.gpick .n{width:40px;height:40px;flex:none;border-radius:11px;background:var(--pri-s);color:var(--pri-d);display:flex;align-items:center;justify-content:center;font-weight:800}
.gpick b{display:block;font-size:1.05em}
.gpick span{color:var(--mu);font-size:.88em;font-weight:500}

/* ---------- 작업실 ---------- */
.room{display:grid;grid-template-columns:1fr 316px;gap:16px;align-items:start}
@media(max-width:980px){.room{grid-template-columns:1fr}.room .side{order:-1}}
.side{display:grid;gap:12px;position:sticky;top:64px}
@media(max-width:980px){.side{position:static}}
.side .card{margin:0}
.brief{background:linear-gradient(180deg,#f4f7ff,#fff);border:1px solid #d3dbfb}
.brief ol,.brief ul{margin:6px 0 0;padding-left:20px}
.brief li{margin:3px 0}
.topicline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.topicline b{color:var(--pri-d)}
.role{display:flex;align-items:center;gap:8px;margin:7px 0}
.role .lab{width:58px;flex:none;color:var(--mu);font-size:.86em;font-weight:700}
.role select{flex:1}
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--panel-2);border:1px solid var(--bd);border-radius:var(--r) var(--r) 0 0;padding:7px;position:sticky;top:56px;z-index:9}
.tb button,.tb select{min-height:34px;padding:4px 9px;width:auto;border-radius:8px;font-weight:600}
.tb .sep{width:1px;height:20px;background:var(--bd);margin:0 3px}
.tb .lab{font-size:.82em;color:var(--mu);font-weight:700;padding:0 2px}
.tb.off{opacity:.45;pointer-events:none}
.doc{background:#fff;border:1px solid var(--bd);border-top:0;border-radius:0 0 var(--r) var(--r);min-height:420px;padding:22px;outline:none;line-height:1.75;overflow-wrap:anywhere}
.doc[contenteditable=false]{background:var(--panel-2)}
.doc:focus{box-shadow:inset 0 0 0 2px rgba(58,91,217,.12)}
.doc table{border-collapse:collapse;margin:10px 0;max-width:100%}
.doc td,.doc th{border:1px solid #9aa3b5;padding:7px 11px;min-width:70px;vertical-align:top}
.doc th{background:var(--pri-s)}
.doc img{max-width:100%;border-radius:6px}
.doc h3{margin:14px 0 6px;color:var(--pri-d)}
.doc p{margin:5px 0}
.doc ul,.doc ol{margin:6px 0;padding-left:24px}
.statusbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 0;font-size:.88em;color:var(--mu)}
.statusbar .grow{flex:1}
.statusbar .live{color:var(--pri-d);font-weight:700}
.timer{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--panel-2);border:1px solid var(--bd);border-radius:999px;padding:5px 13px}
.timer.run{background:var(--pri-s);border-color:#d3dbfb;color:var(--pri-d)}
.timer.end{background:var(--dg-s);border-color:#f0c7c2;color:var(--dg)}

/* ---------- 그리드/행 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.gbox{border:1px solid var(--bd);background:#fff;border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh)}
.gbox:hover{border-color:var(--pri)}
.gbox .snip{color:var(--mu);font-size:.88em;max-height:4.6em;overflow:hidden;margin-top:6px}
.srow{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin:10px 0;background:#fff;box-shadow:var(--sh)}
.srow .info{flex:1;min-width:230px}
.bar{height:7px;border-radius:99px;background:var(--bd-s);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.bar i.ok{background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.kpi .lab{font-size:.8em;color:var(--mu);font-weight:700}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:.5em;color:var(--mu);font-weight:700}
.gedit{border:1px solid var(--bd);border-radius:var(--r);background:#fff;padding:14px 16px;margin:10px 0;box-shadow:var(--sh)}
.gedit .hd{display:flex;gap:8px;align-items:center}
.gedit .hd .ord{display:flex;gap:4px}

/* ---------- 토스트/모달 ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:#101828;color:#fff;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:92vw;font-weight:600;box-shadow:0 8px 24px rgba(16,24,40,.25)}
#toast.on{opacity:.97;transform:translateX(-50%)}

/* ---- 양식 갤러리 ---- */
.tgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:12px}
.tcard{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;display:flex;flex-direction:column;padding:0;text-align:left;min-height:0}
.tcard:hover{border-color:var(--pri);box-shadow:var(--sh);transform:translateY(-2px)}
.tcard.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
.tthumb{height:100px;padding:11px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.tthumb .r{display:flex;gap:5px;align-items:stretch}
.tthumb .b{background:rgba(255,255,255,.95);border-radius:3px;height:9px;flex:1}
.tthumb .b.h{height:13px}
.tthumb .b.d{background:rgba(255,255,255,.55)}
.tthumb .g{display:grid;gap:4px;flex:1}
.tthumb .g .b{height:auto}
.tbody{padding:9px 11px;border-top:1px solid var(--bd-s)}
.tbody b{display:block;font-size:.95em;line-height:1.3}
.tbody .ds{color:var(--mu);font-size:.82em;display:block;margin-top:3px;line-height:1.35}
.tbody .ct{display:inline-block;margin-top:6px;font-size:.74em;font-weight:700;color:var(--pri-d);background:var(--pri-s);border-radius:999px;padding:1px 8px}
/* ---- 포스트잇 보드 ---- */
.bhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bcompose{display:flex;flex-direction:column;gap:8px}
.cols{display:flex;gap:6px;flex-wrap:wrap}
.cols button{width:28px;height:28px;border-radius:50%;padding:0;min-height:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd)}
.cols button.on{box-shadow:0 0 0 3px var(--pri)}
.bwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(166px,1fr));gap:14px;margin-top:12px}
.vswitch{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;background:var(--panel-2);flex:none}
.vswitch button{border:0;background:none;padding:7px 13px;font-size:.88em;font-weight:700;color:var(--mu);min-height:0;border-radius:0}
.vswitch button.on{background:var(--pri);color:#fff}
.catbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--panel-2)}
.catchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;font-size:.86em;font-weight:700;cursor:pointer}
.catchip.on{border-color:var(--pri);box-shadow:0 0 0 2px rgba(47,111,237,.18)}
.catchip .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.catchip b{color:var(--mu);font-size:.9em;font-weight:700}
.catchip .x{border:0;background:none;padding:0 1px;min-height:0;font-size:.9em;color:var(--mu);cursor:pointer}
.catchip .x:hover{color:var(--pri)}
.bmove{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:9px 11px;border:1px solid var(--pri);border-radius:var(--r);background:#eef2fc}
.blanes{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;margin-top:12px;padding:2px 2px 12px}
.blane{flex:0 0 250px;background:var(--panel-2);border:1px solid var(--bd);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.blane.over{border-color:var(--pri);background:#eef2fc;box-shadow:inset 0 0 0 2px rgba(47,111,237,.35)}
.blane-h{display:flex;align-items:center;gap:7px}
.blane-h .dot{width:10px;height:10px;border-radius:50%;flex:none}
.blane-h b{flex:1;word-break:break-all;font-size:.93em}
.blane-h .n{font-size:.78em;color:var(--mu);flex:none}
.blane .lnotes{display:flex;flex-direction:column;gap:10px}
.blane .pnote{min-height:112px;transform:none !important;box-shadow:1px 3px 7px rgba(16,24,40,.16)}
.blane .pnote .tx{max-height:5.2em;font-size:.94em;margin-top:12px}
.blane .lempty{border:2px dashed var(--bd);border-radius:8px;padding:16px 10px;text-align:center;color:var(--mu);font-size:.84em;line-height:1.5}
.blane.add{flex:0 0 150px;min-height:120px;align-items:center;justify-content:center;border-style:dashed;cursor:pointer;color:var(--pri);font-weight:800;background:var(--panel)}
.pnote.drag{opacity:.4}
.pnote .ctg{font-weight:800}
.pnote .mvb{border:0;background:rgba(255,255,255,.8);border-radius:999px;padding:2px 8px;font-size:.95em;font-weight:700;color:#33415c;min-height:0;cursor:pointer;margin-left:auto}
.pnote .mvb:hover{background:#fff;color:var(--pri)}
.pnote{position:relative;border-radius:3px;padding:13px 12px 10px;min-height:152px;display:flex;flex-direction:column;gap:7px;cursor:pointer;box-shadow:2px 4px 10px rgba(16,24,40,.18);transition:transform .12s,box-shadow .12s;color:#1a1a1a}
.pnote:hover{transform:translateY(-4px) rotate(0deg) !important;box-shadow:3px 8px 18px rgba(16,24,40,.24)}
.pnote.sel{outline:3px solid var(--pri);outline-offset:1px}
.pnote .tx{flex:1;white-space:pre-wrap;word-break:break-word;font-weight:600;line-height:1.45;max-height:7.6em;overflow:hidden;margin-top:14px}
.pnote .mt2{font-size:.78em;color:rgba(26,26,26,.62);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pnote .vt{position:absolute;right:7px;top:7px;background:rgba(255,255,255,.8);border-radius:999px;padding:1px 8px;font-size:.76em;font-weight:800;color:#c2185b}
.pnote .pick{position:absolute;left:7px;top:6px;margin:0}
.pnote .pick input{width:17px;height:17px}
.bigNote{border-radius:6px;padding:26px 22px;min-height:230px;font-size:1.5em;font-weight:700;white-space:pre-wrap;word-break:break-word;line-height:1.5;color:#1a1a1a;box-shadow:2px 5px 14px rgba(16,24,40,.18)}
.bempty{grid-column:1/-1;border:2px dashed var(--bd);border-radius:var(--r);padding:26px;text-align:center;color:var(--mu);background:var(--panel-2)}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:#fff;border-radius:16px;padding:16px;width:min(980px,100%);max-height:100%;overflow:auto}

<script>

/* ===================================================================
   생각 모아 봄 — 분임토의 의견 모음 (v3 브랜드 개편)
   화면: 홈(QR 상시) / 참여자 선택 / 모둠 작업실 / 관리자(5탭) / 발표 스테이지
   데이터 경로(기존 호환): ws/<code>/meta, ws/<code>/groups/<gid>, ws/<code>/docs/<gid>
   =================================================================== */

/* ---------- 공통 도구 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- 브랜드 ---------- */
const BRAND = '생각 모아 봄';
const BRAND_TAG = '생각을 모으면, 결론이 보입니다';
let _mk = 0;
function MARK(size, cls) {
  const g = 'mk' + (++_mk);
  return '<svg class="mark ' + (cls || '') + '" width="' + size + '" height="' + size + '" viewBox="0 0 48 48" role="img" aria-label="' + BRAND + '">'
    + '<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5272f2"/><stop offset="1" stop-color="#2a44b0"/></linearGradient></defs>'
    + '<rect width="48" height="48" rx="13" fill="url(#' + g + ')"/>'
    + '<path d="M24 25V14.5" stroke="#86e9bb" stroke-width="2.6" stroke-linecap="round"/>'
    + '<path d="M24 17.4c-1.3-3.5-4.5-4.8-7.3-4.5.3 3.7 3 6.3 7.3 4.5z" fill="#ffffff" opacity=".88"/>'
    + '<path d="M24 14.2c1.2-3.9 4.7-5.3 7.8-5-.4 4-3.2 6.9-7.8 5z" fill="#86e9bb"/>'
    + '<rect x="7" y="24.5" width="15" height="15" rx="3.6" fill="#ffffff" opacity=".93" transform="rotate(-8 14.5 32)"/>'
    + '<rect x="26" y="24.5" width="15" height="15" rx="3.6" fill="#ffffff" opacity=".6" transform="rotate(9 33.5 32)"/>'
    + '<rect x="16.5" y="26.5" width="15" height="15" rx="3.6" fill="#86e9bb"/>'
    + '</svg>';
}
const WORD = '<span class="wordmark">생각 모아 <em>봄</em></span>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = c => String(c || '').trim().toLowerCase().replace(/[^a-z0-9가-힣_-]/g, '');
const nl2 = s => esc(s || '').replace(/\n/g, '<br>');
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
async function sha(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return 'x' + btoa(unescape(encodeURIComponent(s))); }
}
const fmtT = ms => new Date(ms).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
const fmtAgo = ms => { if (!ms) return '기록 없음'; const d = Date.now() - ms; if (d < 60000) return '방금 전'; if (d < 3600000) return Math.floor(d / 60000) + '분 전'; if (d < 86400000) return Math.floor(d / 3600000) + '시간 전'; return fmtT(ms); };
const fmtClock = ms => { const s = Math.max(0, Math.round(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const toLocalInput = ms => { if (!ms) return ''; const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };

/* ---------- 데이터 계층 (Firebase 또는 로컬 연습 모드) ---------- */
const DB = (() => {
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.databaseURL && window.firebase) {
    firebase.initializeApp(cfg);
    const db = firebase.database();
    return {
      mode: 'firebase',
      watch(path, cb) { const r = db.ref(path); const h = r.on('value', s => cb(s.val())); return () => r.off('value', h); },
      get: p => db.ref(p).get().then(s => s.val()),
      set: (p, v) => db.ref(p).set(v),
      update: (p, v) => db.ref(p).update(v),
      remove: p => db.ref(p).remove()
    };
  }
  const KEY = 'wsdemo'; let watchers = [];
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const save = d => localStorage.setItem(KEY, JSON.stringify(d));
  const parts = p => p.split('/').filter(Boolean);
  const getAt = (d, p) => { const v = parts(p).reduce((a, k) => a == null ? undefined : a[k], d); return v === undefined ? null : v; };
  const setAt = (d, p, v) => {
    const ks = parts(p); let o = d;
    ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
    if (v === null || v === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v;
  };
  const fire = () => {
    const d = load();
    watchers.slice().forEach(w => { const s = JSON.stringify(getAt(d, w.path)); if (s !== w.last) { w.last = s; w.cb(JSON.parse(s)); } });
  };
  window.addEventListener('storage', e => { if (e.key === KEY) fire(); });
  return {
    mode: 'local',
    watch(path, cb) {
      const w = { path, cb, last: undefined }; watchers.push(w);
      setTimeout(() => { if (!watchers.includes(w)) return; const s = JSON.stringify(getAt(load(), path)); w.last = s; cb(JSON.parse(s)); }, 0);
      return () => { watchers = watchers.filter(x => x !== w); };
    },
    get: async p => getAt(load(), p),
    set: async (p, v) => { const d = load(); setAt(d, p, v); save(d); fire(); },
    update: async (p, v) => { const d = load(); for (const k in v) setAt(d, p + '/' + k, v[k]); save(d); fire(); },
    remove: async p => { const d = load(); setAt(d, p, null); save(d); fire(); }
  };
})();

/* ---------- 상태 ---------- */
const S = { code: null, meta: null, groups: {}, docs: {}, notes: {}, cats: {}, role: null, gid: null, me: null, view: 'home', tab: 'status', roomTab: 'mine', sel: {}, tplKey: 'basic' };
let B = { col: 0, sort: 'new', mine: false, sel: {}, view: 'wall', cat: null, drag: null };
const app = $('#app');
const ws = p => `ws/${S.code}/${p}`;
let unsubs = [];
function connect(code) {
  S.code = code; unsubs.forEach(f => f()); unsubs = [];
  unsubs.push(DB.watch(`ws/${code}/meta`, v => { S.meta = v || S.meta; onData(); }));
  unsubs.push(DB.watch(`ws/${code}/groups`, v => { S.groups = v || {}; onData(); }));
  unsubs.push(DB.watch(`ws/${code}/notes`, v => { S.notes = v || {}; onData(); }));
  unsubs.push(DB.watch(`ws/${code}/cats`, v => { S.cats = v || {}; onData(); }));
}
const glist = () => Object.entries(S.groups).map(([id, g]) => ({ id, ...g })).sort((a, b) => (a.order || 0) - (b.order || 0));
const mlist = g => Object.entries((g && g.members) || {}).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.o || 0) - (b.o || 0));
const isAdmin = () => S.role === 'admin';
function membersText(g) {
  const ms = mlist(g), lead = ms.find(m => m.id === g.leader), rest = ms.filter(m => m.id !== g.leader).map(m => m.name);
  return [lead ? '분임장 ' + lead.name : '', rest.length ? (lead ? '분임원 ' : '') + rest.join(', ') : ''].filter(Boolean).join(' · ');
}
function periodState(m) { const n = Date.now(); if (m && m.openFrom && n < m.openFrom) return 'before'; if (m && m.openUntil && n > m.openUntil) return 'after'; return 'open'; }
function periodInfo(m) {
  if (!m || (!m.openFrom && !m.openUntil)) return '현재: 제한 없음 (언제나 접속 가능)';
  const s = periodState(m), r = (m.openFrom ? fmtT(m.openFrom) : '처음') + ' ~ ' + (m.openUntil ? fmtT(m.openUntil) : '제한 없음');
  return `현재: ${r} · ${s === 'open' ? '접속 가능' : s === 'before' ? '아직 열리기 전' : '기간 종료됨'}`;
}
const closedForMe = () => !isAdmin() && periodState(S.meta) !== 'open';
const isLeader = () => { const g = S.groups[S.gid]; return !!(g && S.me && g.leader === S.me.id); };
const canTopic = () => isAdmin() || (S.meta && S.meta.leaderTopic && isLeader());
const NCOLS = ['#fff59a', '#ffd59e', '#c6f2d5', '#cfe2ff', '#f3d1fa', '#ffd2d8', '#e3e6ec'];
const boardOn = () => !(S.meta && S.meta.board === 'off');

const OK_TAGS = new Set('p div br b strong i em u s strike span font h1 h2 h3 h4 ul ol li table thead tbody tr td th img mark hr blockquote'.split(' '));
const DROP_TAGS = new Set(['script', 'style', 'iframe', 'object', 'embed', 'link', 'meta', 'svg', 'form', 'input', 'button', 'textarea', 'select', 'video', 'audio']);
function clean(html) {
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const root = doc.body.firstChild;
  (function walk(n) {
    [...n.childNodes].forEach(c => {
      if (c.nodeType === 3) return;
      if (c.nodeType !== 1) { c.remove(); return; }
      const t = c.tagName.toLowerCase();
      if (DROP_TAGS.has(t)) { c.remove(); return; }
      walk(c);
      if (!OK_TAGS.has(t)) { while (c.firstChild) c.parentNode.insertBefore(c.firstChild, c); c.remove(); return; }
      [...c.attributes].forEach(a => {
        const k = a.name.toLowerCase(), v = a.value;
        const ok = (k === 'style' && !/expression|url\(|javascript|@import/i.test(v)) || ['size', 'color', 'colspan', 'rowspan', 'alt'].includes(k) ||
          (k === 'src' && t === 'img' && /^(data:image\/(png|jpeg|gif|webp);base64,|https:\/\/)/i.test(v));
        if (!ok) c.removeAttribute(a.name);
      });
    });
  })(root);
  return root.innerHTML;
}
const textOf = html => { const d = document.createElement('div'); d.innerHTML = clean(html); return (d.textContent || '').replace(/\s+/g, ' ').trim(); };

/* 양식 미리보기 썸네일 */
function thumbHtml(key) {
  const t = TPL[key] || {}, col = CATCOL[t.cat] || '#64748b';
  const row = (n, cls) => '<div class="r">' + Array.from({ length: n }, () => '<div class="b ' + (cls || '') + '"></div>').join('') + '</div>';
  const grid = (c, n, dark) => '<div class="g" style="grid-template-columns:repeat(' + c + ',1fr)">' +
    Array.from({ length: n }, (x, i) => '<div class="b' + (dark && i % 2 ? ' d' : '') + '"></div>').join('') + '</div>';
  const mid = w => '<div class="r" style="justify-content:center"><div class="b" style="flex:0 0 ' + w + '%"></div></div>';
  let inner;
  switch (t.pv) {
    case 'tbl3': inner = row(3, 'h') + row(3) + row(3, 'd') + row(3); break;
    case 'col3': inner = row(3, 'h') + grid(3, 3); break;
    case 'col2': inner = row(2, 'h') + grid(2, 2); break;
    case 'q4': inner = grid(2, 4, true); break;
    case 'g9': inner = grid(3, 9, true); break;
    case 'list': inner = row(1, 'h') + row(1) + row(1, 'd') + row(1); break;
    case 'notes': inner = grid(3, 6, true); break;
    case 'pyr': inner = mid(26) + mid(54) + mid(82) + mid(100); break;
    case 'step': inner = row(4, 'h') + row(1) + row(1, 'd'); break;
    case 'mtx': inner = row(4, 'h') + grid(4, 8, true); break;
    case 'bars': inner = row(1) + row(1, 'd') + row(1) + row(1, 'd') + row(1); break;
    default: inner = row(1, 'h') + row(1) + row(1, 'd') + row(2);
  }
  return '<div class="tthumb" style="background:' + col + '">' + inner + '</div>';
}

/* 양식 갤러리 모달 */
function openTplGallery(onPick, opt) {
  opt = opt || {};
  const cats = ['전체'].concat(Object.keys(CATCOL));
  let cur = '전체';
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="mbox"><div class="mt"><span>' + esc(opt.title || '토의 · 토론 양식 갤러리') + '</span><button class="sm" id="gx">✕ 닫기</button></div>' +
    '<p class="mu" style="margin-top:0">' + esc(opt.hint || '양식을 누르면 작업실 문서에 바로 들어갑니다. 모두 ' + Object.keys(TPL).length + '종.') + '</p>' +
    '<div class="tabs" id="gcat"></div><div class="tgal" id="ggal"></div></div>';
  document.body.appendChild(m); document.body.classList.add('noscroll');
  const close = () => { m.remove(); document.body.classList.remove('noscroll'); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); };
  const paint = () => {
    $('#gcat', m).innerHTML = cats.map(c => '<button data-c="' + esc(c) + '" class="' + (c === cur ? 'on' : '') + '">' + esc(c) + '</button>').join('');
    $$('#gcat [data-c]', m).forEach(b => b.onclick = () => { cur = b.dataset.c; paint(); });
    const ks = Object.keys(TPL).filter(k => cur === '전체' || TPL[k].cat === cur);
    $('#ggal', m).innerHTML = ks.map(k => '<div class="tcard' + (opt.sel === k ? ' on' : '') + '" data-k="' + k + '">' + thumbHtml(k) +
      '<div class="tbody"><b>' + esc(TPL[k].name) + '</b><span class="ds">' + esc(TPL[k].desc || '') + '</span><span class="ct">' + esc(TPL[k].cat) + '</span></div></div>').join('');
    $$('#ggal [data-k]', m).forEach(c => c.onclick = () => { close(); onPick(c.dataset.k); });
  };
  paint();
  $('#gx', m).onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
  document.addEventListener('keydown', key);
}

/* ===================== 참여자 입장 ===================== */
async function openMember(code) {
  const m = await DB.get(`ws/${code}/meta`);
  if (!m) { renderHome(); toast('열려 있는 워크숍을 찾을 수 없어요 (코드 확인)'); return; }
  const ps = periodState(m);
  if (ps !== 'open') { history.replaceState(null, '', location.pathname); renderHome(); toast(ps === 'before' ? `아직 열리지 않았어요 (${fmtT(m.openFrom)}부터)` : '접속 기간이 끝난 워크숍이에요'); return; }
  localStorage.setItem('wsLastCode', code);
  S.role = 'member'; S.meta = m; S.groups = (await DB.get(`ws/${code}/groups`)) || {};
  S.view = 'loading'; connect(code);
  let saved = null; try { saved = JSON.parse(localStorage.getItem('wsMe') || 'null'); } catch (e) { }
  const g = saved && saved.code === code && S.groups[saved.gid];
  if (g && g.members && g.members[saved.mid]) { S.gid = saved.gid; S.me = { id: saved.mid, name: g.members[saved.mid].name }; renderRoom(); }
  else renderPick();
}

function roleOptions(ms, cur) {

}

function updateRoom() {
  const g = S.groups[S.gid];
  if (!g) { leaveRoom(); toast('분임이 삭제되었어요'); return isAdmin() ? renderAdmin() : renderPick(); }
  const done = g.status === 'done', closed = closedForMe(), lock = done || closed;
  const ms = mlist(g), roles = g.roles || {};

  $('#briefSlot').innerHTML = briefCardHtml(true);
  const st = $('#rStatus'); st.textContent = done ? '완료' : '토론 중'; st.className = 'badge ' + (done ? 'ok' : 'live');
  $('#rTopic').textContent = g.topic || '(아직 정해지지 않았어요)';
  $('#topicBtn').hidden = !canTopic() || done;
  $('#pcnt').textContent = ms.length ? `${ms.length}명` : '';
  $('#rPeople').innerHTML = ms.map(m => {
    const tags = [m.id === g.leader ? '분임장' : '', m.id === roles.note ? '기록' : '', m.id === roles.pres ? '발표' : ''].filter(Boolean);
    return `<span class="person ${m.id === g.leader ? 'lead' : ''}">${esc(m.name)}${tags.length ? ' · ' + tags.join('/') : ''}</span>`;
  }).join('') || '<span class="mu">구성원 없음</span>';

  const canRole = isAdmin() || isLeader();
  [['#rLead', g.leader], ['#rNote', roles.note], ['#rPres', roles.pres]].forEach(([sel, cur]) => {
    const el = $(sel); if (!el) return;
    if (document.activeElement !== el) el.innerHTML = roleOptions(ms, cur || '');
    el.disabled = !canRole || done;
  });
  $('#roleHint').textContent = canRole ? '분임장과 관리자가 역할을 바꿀 수 있어요.' : '역할 변경은 분임장 또는 진행자가 할 수 있어요.';

  const ed = $('#editor'); ed.contentEditable = lock ? 'false' : 'true';
  $('#tb').classList.toggle('off', lock);
  $('#sumBox').disabled = lock;
  if (!R.sumLoaded) { const d = S.docs[S.gid]; $('#sumBox').value = (d && d.summary) || ''; R.sumLoaded = true; }
  if (closed && !R.warned) { R.warned = true; toast('접속 기간이 끝나 보기 전용이에요'); }

  const db = $('#doneBtn'); db.disabled = closed;

  const bt = $('#tabBoard');
  if (bt) {
    bt.hidden = !boardOn();
    bt.textContent = `🗒 포스트잇 보드 (${noteList(S.gid).length})`;
    if (!boardOn() && S.roomTab === 'board') { const t = $('.tabs [data-t="mine"]'); if (t) t.click(); }
  }
  const bc = $('#bClear'); if (bc) bc.hidden = !(isAdmin() || isLeader());
  const ba = $('#bAdd'); if (ba) ba.disabled = closed;
  if (S.roomTab === 'board') renderBoard();

  const others = glist().filter(x => x.id !== S.gid && x.status === 'done');
  $('#tabOthers').textContent = `다른 분임 의견 (${others.length})`;
  const grid = $('#othersGrid'), key = others.map(o => o.id + (o.topic || '')).join('|');
  if (grid && (S.roomTab === 'others' || !grid.dataset.k) && grid.dataset.k !== key) {
    grid.dataset.k = key;
    grid.innerHTML = others.length ? others.map(o => `<div class="gbox" data-o="${o.id}">
      <div class="card-h"><b>${esc(o.name)}</b><span class="badge ok">완료</span></div>
      <div class="mu">${esc(o.topic || '주제 미정')}</div>
      <div class="snip" id="sn-${o.id}">내용을 불러오는 중…</div></div>`).join('') : '<div class="card mu">아직 완료한 다른 분임이 없어요.</div>';
    $$('[data-o]', grid).forEach(b => b.onclick = () => { const ids = glist().filter(x => x.status === 'done').map(x => x.id); openPresent(ids, ids.indexOf(b.dataset.o)); });
    others.forEach(o => DB.get(ws('docs/' + o.id)).then(d => {
      const el = $('#sn-' + o.id); if (!el) return;
      const s = (d && d.summary) ? d.summary : textOf(d && d.html);
      el.textContent = (s || '').slice(0, 140) || '(내용 없음)';

}

/* ---------- 편집기 ---------- */
let savedRange = null;
document.addEventListener('selectionchange', () => {
  const ed = $('#editor'); if (!ed) return; const s = getSelection();
  if (s.rangeCount && ed.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange();
});
function restoreSel() {
  const ed = $('#editor'); ed.focus(); const s = getSelection();
  if (savedRange && ed.contains(savedRange.startContainer)) { s.removeAllRanges(); s.addRange(savedRange); }
  else { const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
}
const editable = () => $('#editor') && $('#editor').contentEditable === 'true';
function cmd(c, v) {
  if (!editable()) return; restoreSel();
  document.execCommand('styleWithCSS', false, c === 'hiliteColor');
  document.execCommand(c, false, v || null); afterEdit();
}
function afterEdit() { const s = getSelection(); if (s.rangeCount && $('#editor').contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); scheduleSave(); updateStats(); }
function insertTable(r, c) {
  if (!editable()) return; let h = '<table id="__nt"><tbody>';
  for (let i = 0; i < r; i++) { h += '<tr>'; for (let j = 0; j < c; j++) h += (i === 0 ? '<th><br></th>' : '<td><br></td>'); h += '</tr>'; }
  restoreSel(); document.execCommand('insertHTML', false, h + '</tbody></table><p><br></p>');
  const t = $('#editor').querySelector('#__nt');
  if (t) { t.removeAttribute('id'); const cell = t.querySelector('th,td'); if (cell) { const rg = document.createRange(); rg.selectNodeContents(cell); rg.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); } }
  afterEdit();
}
function tblOp(op) {
  if (!editable()) return;
  const n = savedRange && savedRange.startContainer, el = n && (n.nodeType === 1 ? n : n.parentElement);
  const td = el && el.closest && el.closest('td,th');
  if (!td || !$('#editor').contains(td)) return toast('표 안의 칸을 먼저 눌러 주세요');
  const tr = td.parentElement, table = td.closest('table'), ci = [...tr.children].indexOf(td);
  if (op === 'ar') { const nr = tr.cloneNode(true); [...nr.children].forEach(c => { const nc = document.createElement('td'); nc.innerHTML = '<br>'; c.replaceWith(nc); }); tr.after(nr); }
  if (op === 'dr') { table.rows.length <= 1 ? table.remove() : tr.remove(); }
  if (op === 'ac') [...table.rows].forEach(r => { const c = r.children[ci]; if (c) { const nc = document.createElement(c.tagName.toLowerCase()); nc.innerHTML = '<br>'; c.after(nc); } });
  if (op === 'dc') { tr.children.length <= 1 ? table.remove() : [...table.rows].forEach(r => r.children[ci] && r.children[ci].remove()); }
  if (op === 'dt') table.remove();
  savedRange = null; scheduleSave(); updateStats();
}
function bindEditor() {
  const tb = $('#tb'), ed = $('#editor');
  ['mousedown', 'pointerdown'].forEach(ev => tb.addEventListener(ev, e => { if (!e.target.closest('select')) e.preventDefault(); }));
  $$('[data-c]', tb).forEach(b => b.onclick = () => cmd(b.dataset.c, b.dataset.v));
  $$('[data-t]', tb).forEach(b => b.onclick = () => tblOp(b.dataset.t));
  $('#fs').onchange = e => { if (e.target.value) cmd('fontSize', e.target.value); e.target.value = ''; };
  $('#addTbl').onclick = () => insertTable(+$('#tr').value, +$('#tc').value);
  $('#tplBtn').onclick = () => {
    if (!editable()) return toast('완료 처리된 방은 수정할 수 없어요. 먼저 다시 열어 주세요');
    openTplGallery(k => {
      restoreSel(); document.execCommand('insertHTML', false, TPL[k].html); afterEdit();
      toast(TPL[k].name + ' 양식을 넣었어요');
    }, { hint: '커서 위치에 양식이 들어갑니다. 모두 ' + Object.keys(TPL).length + '종.' });
  };
  $('#draw').onclick = openDraw;
  ed.addEventListener('input', () => { scheduleSave(); updateStats(); });
  ed.addEventListener('blur', () => flushSave());
  ed.addEventListener('paste', e => {
    e.preventDefault(); const h = e.clipboardData.getData('text/html'), t = e.clipboardData.getData('text/plain');
    if (h) document.execCommand('insertHTML', false, clean(h)); else document.execCommand('insertText', false, t);
    afterEdit();
  });
  $('#topicBtn').onclick = async () => {
    const g = S.groups[S.gid]; const t = prompt('이 분임의 토론 주제를 입력하세요', g.topic || ''); if (t === null) return;
    await DB.update(ws('groups/' + S.gid), { topic: t.trim(), topicBy: isAdmin() ? 'admin' : 'leader' }); toast('주제를 저장했어요');
  };
  $('#rLead').onchange = e => DB.update(ws('groups/' + S.gid), { leader: e.target.value }).then(() => toast('분임장을 변경했어요'));
  $('#rNote').onchange = e => DB.update(ws('groups/' + S.gid + '/roles'), { note: e.target.value }).then(() => toast('기록자를 지정했어요'));
  $('#rPres').onchange = e => DB.update(ws('groups/' + S.gid + '/roles'), { pres: e.target.value }).then(() => toast('발표자를 지정했어요'));
  const saveSum = () => DB.update(ws('docs/' + S.gid), { summary: $('#sumBox').value.trim(), summaryTs: Date.now() })
    .then(() => { $('#sumState').textContent = '요약 저장됨 ✓'; }).catch(() => { $('#sumState').textContent = '저장 실패'; });
  $('#sumSave').onclick = saveSum;
  $('#sumBox').oninput = () => { $('#sumState').textContent = '입력 중…'; clearTimeout(R.sumTimer); R.sumTimer = setTimeout(saveSum, 1200); };
  $('#doneBtn').onclick = async () => {

    if (g.status === 'done') { await DB.update(ws('groups/' + S.gid), { status: 'open' }); return toast('다시 열었어요. 수정 후 완료를 눌러 주세요'); }
    if (!confirm('토론 내용을 완료하고 다른 분임에 공유할까요?\n(완료 후에도 다시 열어 수정할 수 있어요)')) return;
    await flushSave(); await DB.update(ws('groups/' + S.gid), { status: 'done', doneAt: Date.now() }); toast('완료! 다른 분임에서 볼 수 있어요');
  };
  $('#pdf').onclick = async () => { await flushSave(); exportPdf([S.gid]); };
  $('#hwpx').onclick = async () => { await flushSave(); exportHwpx([S.gid]); };

/* ---------- 저장·동기화 ---------- */
function setSaveState(t) { const e = $('#saveState'); if (e) e.textContent = t; }
function scheduleSave() { if (!R) return; R.lastTypeAt = Date.now(); clearTimeout(R.saveTimer); R.saveTimer = setTimeout(doSave, 700); setSaveState('저장 중…'); }
function doSave() {
  clearTimeout(R.saveTimer); R.saveTimer = null; const ed = $('#editor'); if (!ed || !editable()) return Promise.resolve();
  const html = ed.innerHTML; if (html === R.lastApplied) { setSaveState('저장됨 ✓'); return Promise.resolve(); }
  R.lastApplied = html; R.pending = null;
  return DB.update(ws('docs/' + S.gid), { html, editor: S.me.name, editorTs: Date.now() })
    .then(() => setSaveState('저장됨 ✓')).catch(() => setSaveState('⚠ 저장 실패 — 네트워크 확인'));
}
const flushSave = () => (R && R.saveTimer) ? doSave() : Promise.resolve();
window.addEventListener('beforeunload', () => { if (R && R.saveTimer) doSave(); });
function setEditor(html) { const ed = $('#editor'); if (!ed) return; ed.innerHTML = clean(html); R.lastApplied = html; R.pending = null; R.loaded = true; updateStats(); }
function applyDoc() {
  const ed = $('#editor'); if (!ed) return; const d = S.docs[S.gid], html = (d && d.html) || '';
  if (!R.loaded) setSaveState('저장됨 ✓');
  if (R.loaded && html === R.lastApplied) { updateBadge(); updateStats(); return; }
  const typing = document.activeElement === ed && Date.now() - R.lastTypeAt < 4000;
  if (R.loaded && (R.saveTimer || typing)) { R.pending = html; return; }
  setEditor(html); updateBadge();
  const sb = $('#sumBox');
  if (sb && document.activeElement !== sb) sb.value = (d && d.summary) || '';
}
function roomTick() {
  const ed = $('#editor'); if (!ed) return;
  const ps = periodState(S.meta); if (ps !== R.pstate) { R.pstate = ps; if (S.groups[S.gid]) updateRoom(); }
  if (R.pending != null && !R.saveTimer && !(document.activeElement === ed && Date.now() - R.lastTypeAt < 4000)) { if (R.pending !== R.lastApplied) setEditor(R.pending); R.pending = null; }
  updateBadge();
}
function updateBadge() {

/* ---------- 포스트잇 의견 보드 ---------- */
function bindBoard() {
  const cols = $('#bCols'); if (!cols) return;
  cols.innerHTML = NCOLS.map((c, i) => '<button data-ci="' + i + '" class="' + (i === B.col ? 'on' : '') + '" style="background:' + c + '" title="색 선택"></button>').join('');
  $$('[data-ci]', cols).forEach(b => b.onclick = () => { B.col = +b.dataset.ci; $$('[data-ci]', cols).forEach(x => x.classList.toggle('on', x === b)); });
  $('#bAdd').onclick = addNote;
  $('#bText').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); addNote(); } });
  $('#bSort').onchange = e => { B.sort = e.target.value; renderBoard(); };
  $('#bMine').onchange = e => { B.mine = e.target.checked; renderBoard(); };
  $('#bPickAll').onclick = () => { noteList(S.gid).forEach(n => { B.sel[n.id] = true; }); renderBoard(); };
  $('#bPickNone').onclick = () => { B.sel = {}; renderBoard(); };
  $('#bToDoc').onclick = notesToDoc;
  $('#bClear').onclick = clearBoard;
  $$('#bView button').forEach(b => b.onclick = () => { B.view = b.dataset.v; setView(); });
  $('#bMoveGo').onclick = async () => {
    const ids = pickedIds(), cat = $('#bMoveSel').value;
    if (!ids.length) return toast('먼저 포스트잇을 고르세요');
    if (closedForMe()) return toast('접속 기간이 끝나 보기 전용이에요');
    for (const id of ids) await DB.update(ws('notes/' + S.gid + '/' + id), { cat: cat || '' });
    const c = catList(S.gid).find(x => x.id === cat);
    toast(ids.length + '장을 ' + (c ? '「' + c.name + '」' : '미분류') + '(으)로 옮겼어요');

}
function setView() {

}
async function addNote() {
  const ta = $('#bText'); if (!ta) return;

  if (closedForMe()) return toast('접속 기간이 끝나 보기 전용이에요');
  const id = uid('n');
  await DB.set(ws('notes/' + S.gid + '/' + id), { t, by: (S.me && S.me.name) || '익명', byId: myId(), col: B.col, ts: Date.now() });
  ta.value = ''; ta.focus(); B.sel[id] = true; renderBoard(); toast('포스트잇을 붙였어요');
}
function renderBoard() {
  const wall = $('#bWall'), lanes = $('#bLanes'); if (!wall) return;
  const all = noteList(S.gid), cs = catList(S.gid);
  let ns = B.mine ? all.filter(n => n.byId === myId()) : all.slice();
  if (B.cat !== null && B.view !== 'cat') ns = ns.filter(n => (n.cat || '') === B.cat);
  ns.sort((a, b) => B.sort === 'vote' ? (noteVotes(b) - noteVotes(a) || b.ts - a.ts) : B.sort === 'old' ? a.ts - b.ts : b.ts - a.ts);

        '<div class="lnotes">' + (items.map(n => noteCardHtml(n)).join('') || '<div class="lempty">여기로 포스트잇을<br>끌어다 놓으세요</div>') + '</div></div>';
    }).join('') + '<div class="blane add" id="laneAdd">+ 주제 추가</div>';
    bindNotes(lanes, ord);
    $$('.blane[data-lane]', lanes).forEach(l => {
      l.ondragover = e => { e.preventDefault(); l.classList.add('over'); };
      l.ondragleave = () => l.classList.remove('over');
      l.ondrop = e => {

    bindNotes(wall, ord);

}
function noteCardHtml(n) {
  const v = noteVotes(n), rot = B.view === 'cat' ? 0 : (((n.ts || 0) % 5) - 2) * 0.7, mine = n.byId === myId();
  const c = catList(S.gid).find(x => x.id === (n.cat || ''));
  return '<div class="pnote' + (B.sel[n.id] ? ' sel' : '') + '" draggable="true" data-n="' + n.id + '" style="background:' + (NCOLS[n.col || 0] || NCOLS[0]) + ';transform:rotate(' + rot + 'deg)">' +
    '<label class="pick" title="정리에 포함"><input type="checkbox" class="npick" data-n="' + n.id + '" ' + (B.sel[n.id] ? 'checked' : '') + '></label>' +
    (v ? '<span class="vt">♥ ' + v + '</span>' : '') +
    '<div class="tx">' + esc(n.t) + '</div>' +
    '<div class="mt2">' + (c && B.view !== 'cat' ? '<span class="ctg" style="color:' + CATC[c.col || 0] + '">● ' + esc(c.name) + '</span> · ' : '') +
    esc(n.by || '') + (mine ? ' (나)' : '') + ' · ' + esc(fmtAgo(n.ts)) +
    '<button class="mvb nmv" data-n="' + n.id + '" title="주제 묶음 옮기기">⇄ 주제</button></div></div>';
}
function bindNotes(root, ord) {
  $$('.npick', root).forEach(c => c.onclick = e => {
    e.stopPropagation(); B.sel[c.dataset.n] = c.checked;
    const box = c.closest('.pnote'); if (box) box.classList.toggle('sel', c.checked); updatePickCnt();
  });
  $$('.nmv', root).forEach(b => b.onclick = e => { e.stopPropagation(); pickCatFor(b.dataset.n); });
  $$('.pnote', root).forEach(el => {
    el.onclick = () => openNote(el.dataset.n, ord);
    el.ondragstart = e => {
      B.drag = el.dataset.n; el.classList.add('drag');
      if (e.dataTransfer) { e.dataTransfer.setData('text/plain', el.dataset.n); e.dataTransfer.effectAllowed = 'move'; }
    };
    el.ondragend = () => { el.classList.remove('drag'); B.drag = null; };
  });
}

    (id && can ? '<button class="x" data-ce="' + id + '" title="이름 바꾸기">✎</button><button class="x" data-cd="' + id + '" title="주제 지우기">✕</button>' : '') + '</span>';

    CATPRE.map((p, i) => '<option value="' + i + '">' + esc(p.n) + '</option>').join('') + '</select>';
  $$('.catchip', bar).forEach(el => el.onclick = e => {

  });
  $$('[data-cd]', bar).forEach(bt => bt.onclick = async e => {
    e.stopPropagation();

    if (!confirm('주제 「' + c.name + '」을 지울까요?\n이 주제의 포스트잇은 미분류로 돌아갑니다.')) return;
    for (const n of noteList(S.gid)) if ((n.cat || '') === c.id) await DB.update(ws('notes/' + S.gid + '/' + n.id), { cat: '' });
    await DB.remove(ws('cats/' + S.gid + '/' + c.id));

      await DB.set(ws('cats/' + S.gid + '/' + uid('c')), { name: set.v[k], col: (base + k) % CATC.length, ord: base + k, ts: Date.now() + k });
    B.cat = null; B.view = 'cat'; setView(); toast('주제 묶음 ' + set.v.length + '개를 만들었어요');

  const nm = prompt('새 주제 이름을 입력하세요\n예) 문제점 / 해결 방안 / 예산 / 홍보'); if (nm === null) return;

}
async function moveNote(id, cat) {

function pickCatFor(id) {

function pickedIds() { return Object.keys(B.sel).filter(k => B.sel[k] && noteList(S.gid).some(n => n.id === k)); }
function updatePickCnt() {
  const b = $('#bToDoc'); if (!b) return;
  const n = pickedIds().length;
  b.textContent = n ? '선택한 ' + n + '장 본문으로 정리' : '전체 의견 본문으로 정리';
  const mv = $('#bMove');
  if (mv) {

    if (sel) sel.innerHTML = '<option value="">미분류</option>' + catList(S.gid).map(x => '<option value="' + x.id + '">' + esc(x.name) + '</option>').join('');
  }
}
function openNote(id, ord) {
  let n = noteList(S.gid).find(x => x.id === id); if (!n) return;
  const order = (ord && ord.length) ? ord : noteList(S.gid).map(x => x.id);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="mbox" style="width:min(640px,100%)"><div class="mt"><span>포스트잇 크게 보기</span><button class="sm" id="nx">✕ 닫기</button></div><div id="nBody"></div>' +
    '<p class="mu" style="margin:10px 0 0">← → 로 다른 포스트잇을 볼 수 있어요.</p></div>';
  document.body.appendChild(m); document.body.classList.add('noscroll');
  const close = () => { m.remove(); document.body.classList.remove('noscroll'); document.removeEventListener('keydown', key); renderBoard(); };
  const go = d => {
    const list = noteList(S.gid), i = order.indexOf(n.id);
    for (let k = 1; k <= order.length; k++) {
      const f = list.find(x => x.id === order[(i + d * k + order.length * k) % order.length]);
      if (f) { n = f; paint(); return; }
    }
  };
  const key = e => {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  };
  function paint() {
    const can = (n.byId && n.byId === myId()) || isAdmin() || isLeader();
    const voted = !!(n.votes && n.votes[myId()]), v = noteVotes(n);
    $('#nBody', m).innerHTML = '<div class="bigNote" style="background:' + (NCOLS[n.col || 0] || NCOLS[0]) + '">' + esc(n.t) + '</div>' +
      '<p class="mu" style="margin:12px 0 0">' + esc(n.by || '') + ' · ' + esc(fmtT(n.ts)) + '</p>' +
      '<div class="row wrap" style="margin-top:10px"><span class="mu" style="flex:none">주제 묶음</span><select id="nCat" style="flex:1;min-width:150px"><option value="">미분류</option>' +
      catList(S.gid).map(c => '<option value="' + c.id + '"' + ((n.cat || '') === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></div>' +
      '<div class="btnrow" style="margin-top:12px"><button id="nPrev">← 이전</button><button id="nNext">다음 →</button>' +
      '<span class="grow"></span><button id="nVote" class="' + (voted ? 'pri' : '') + '">♥ 공감 ' + v + '</button>' +
      (can ? '<button id="nEdit">수정</button><button class="warn" id="nDel">삭제</button>' : '') + '</div>';
    $('#nPrev', m).onclick = () => go(-1);
    $('#nNext', m).onclick = () => go(1);
    const nc = $('#nCat', m);
    if (nc) nc.onchange = async () => {
      if (closedForMe()) return toast('접속 기간이 끝나 보기 전용이에요');
      n.cat = nc.value;
      await DB.update(ws('notes/' + S.gid + '/' + n.id), { cat: nc.value || '' });
      const c = catList(S.gid).find(x => x.id === nc.value);
      toast(c ? '「' + c.name + '」(으)로 옮겼어요' : '미분류로 옮겼어요');
    };
    $('#nVote', m).onclick = async () => {
      const vs = Object.assign({}, n.votes || {});
      if (voted) delete vs[myId()]; else vs[myId()] = true;
      n.votes = vs; paint();
      await DB.set(ws('notes/' + S.gid + '/' + n.id + '/votes/' + myId()), voted ? null : true);
    };
    if (can) {
      $('#nEdit', m).onclick = async () => {
        const t = prompt('의견을 수정하세요', n.t); if (t === null) return;
        if (!t.trim()) return toast('내용을 비울 수 없어요');
        n.t = t.trim(); paint();
        await DB.update(ws('notes/' + S.gid + '/' + n.id), { t: t.trim(), editTs: Date.now() });
        toast('수정했어요');
      };
      $('#nDel', m).onclick = async () => {
        if (!confirm('이 포스트잇을 지울까요?')) return;
        await DB.remove(ws('notes/' + S.gid + '/' + n.id));
        delete B.sel[n.id]; toast('지웠어요'); close();
      };
    }
  }
  paint();
  $('#nx', m).onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
  document.addEventListener('keydown', key);
}
function notesToDoc() {
  const all = noteList(S.gid), ids = pickedIds();
  const pick = ids.length ? all.filter(n => ids.includes(n.id)) : all;
  if (!pick.length) return toast('정리할 포스트잇이 없어요');
  if (!editable()) return toast('완료 처리된 방은 수정할 수 없어요. 먼저 다시 열어 주세요');
  pick.sort((a, b) => noteVotes(b) - noteVotes(a) || a.ts - b.ts);
  const tbl = list => '<table><tbody><tr><th>번호</th><th>의견</th><th>작성자</th><th>공감</th></tr>' +
    list.map((n, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(n.t).replace(/\n/g, '<br>') + '</td><td>' + esc(n.by || '') + '</td><td>' + noteVotes(n) + '</td></tr>').join('') + '</tbody></table>';
  const cs = catList(S.gid);
  const buckets = cs.map(c => ({ name: c.name, items: pick.filter(n => (n.cat || '') === c.id) }))
    .concat([{ name: '미분류', items: pick.filter(n => !cs.some(c => c.id === (n.cat || ''))) }]).filter(x => x.items.length);
  const grouped = cs.length > 0 && buckets.length > 0;
  const html = '<h3>포스트잇 의견 모음 (' + pick.length + '장' + (grouped ? ' · 주제 ' + buckets.length + '묶음' : '') + ')</h3>' +
    (grouped ? buckets.map(bk => '<h4>■ ' + esc(bk.name) + ' (' + bk.items.length + '장)</h4>' + tbl(bk.items)).join('') : tbl(pick)) +
    '<h3>우리 분임이 정리한 의견</h3><ol><li><br></li><li><br></li><li><br></li></ol><p><br></p>';
  const ed = $('#editor'); const t = $('.tabs [data-t="mine"]'); if (t) t.click();
  ed.focus();
  const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); savedRange = r.cloneRange();
  document.execCommand('insertHTML', false, html);
  afterEdit(); ed.scrollIntoView({ block: 'end' });
  toast(pick.length + '장을 본문에 정리해 넣었어요');
}
async function clearBoard() {
  if (!(isAdmin() || isLeader())) return toast('보드 비우기는 분임장 또는 진행자만 할 수 있어요');
  if (!confirm('이 분임의 포스트잇을 모두 지울까요?\n되돌릴 수 없습니다.')) return;
  await DB.remove(ws('notes/' + S.gid)); B.sel = {}; renderBoard(); toast('보드를 비웠어요');
}

/* ---------- 그리기 ---------- */
function openDraw() {
  if (!editable()) return;
  const m = document.createElement('div'); m.className = 'modal';
  const cols = ['#111111', '#d32f2f', '#1a4fd6', '#16915a', '#e08a00'];
  m.innerHTML = `<div class="mbox"><div class="mt">그리기 <button id="dx" class="sm">✕</button></div>
  <div class="dtools">${cols.map((c, i) => `<button class="sw ${i ? '' : 'on'}" data-col="${c}" style="background:${c}"></button>`).join('')}
    <button class="sm" data-w="3">가늘게</button><button class="sm" data-w="7">보통</button><button class="sm" data-w="14">굵게</button>
    <button class="sm" id="er">지우개</button><button class="sm" id="un">↶ 되돌리기</button><button class="sm" id="cl">모두 지우기</button></div>
  <canvas id="cv" width="900" height="520"></canvas>
  <div class="btnrow" style="margin-top:10px"><span class="grow"></span><button id="dc">취소</button><button class="pri" id="di">문서에 넣기</button></div></div>`;
  document.body.appendChild(m);
  const cv = $('#cv', m), ctx = cv.getContext('2d'); let color = '#111111', w = 7, drawing = false, last = null; const hist = [];
  const blank = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }; blank(); ctx.lineCap = ctx.lineJoin = 'round';
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  const seg = (a, b) => { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drawing = true; hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 25) hist.shift(); last = pt(e); seg(last, last); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); seg(last, p); last = p; });
  ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => drawing = false));
  $$('[data-col]', m).forEach(b => b.onclick = () => { color = b.dataset.col; $$('.sw', m).forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-w]', m).forEach(b => b.onclick = () => w = +b.dataset.w);
  $('#er', m).onclick = () => { color = '#ffffff'; w = 24; $$('.sw', m).forEach(x => x.classList.remove('on')); };
  $('#un', m).onclick = () => { const h = hist.pop(); if (h) ctx.putImageData(h, 0, 0); };
  $('#cl', m).onclick = () => { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); blank(); };
  const close = () => m.remove(); $('#dx', m).onclick = $('#dc', m).onclick = close;
  $('#di', m).onclick = () => { const url = cv.toDataURL('image/png'); close(); restoreSel(); document.execCommand('insertHTML', false, `<img src="${url}" alt="그림"><p><br></p>`); afterEdit(); };
}

async function adminEnter(code, pin, title, silent) {
  if (!code || !pin) { if (!silent) toast('코드와 PIN을 입력하세요'); return false; }
  const m = await DB.get(`ws/${code}/meta`), h = await sha(code + ':' + pin);
  if (!m) {
    if (silent) return false;
    if (!title) { toast('새 워크숍이에요. 제목을 입력하세요'); return false; }
    if (pin.length < 4) { toast('PIN은 4자 이상으로 정해 주세요'); return false; }
    await DB.set(`ws/${code}/meta`, { title, pinHash: h, leaderTopic: true, created: Date.now() });
  } else if (m.pinHash !== h) { if (!silent) toast('PIN이 맞지 않아요'); return false; }
  sessionStorage.setItem('wsAdmin', JSON.stringify({ code, pin }));
  localStorage.setItem('wsLastCode', code);
  S.role = 'admin'; S.meta = m || { title, leaderTopic: true }; S.groups = (await DB.get(`ws/${code}/groups`)) || {};
  S.view = 'loading'; connect(code);
  S.tab = Object.keys(S.groups).length ? 'status' : 'groups';
  if (new URLSearchParams(location.search).get('admin') !== '1') history.replaceState(null, '', adminUrl());
  renderAdmin(); return true;
}

async function changeCode(v) {
  const nc = norm(v);
  if (!nc) return toast('새 코드를 입력하세요');
  if (nc === S.code) return toast('현재 코드와 같아요');
  if (await DB.get(`ws/${nc}/meta`)) return toast('이미 사용 중인 코드예요. 다른 코드를 써 주세요');
  if (!confirm(`접속 코드를 "${S.code}" → "${nc}" 로 바꿀까요?\n기존 분임·내용은 그대로 옮겨지고, 참여자는 새 QR/코드로 들어와야 합니다.`)) return;
  let pin = ''; try { pin = (JSON.parse(sessionStorage.getItem('wsAdmin') || '{}').pin) || ''; } catch (e) { }
  const all = await DB.get(`ws/${S.code}`);
  if (!all) return toast('데이터를 읽지 못했어요');
  if (pin) { all.meta = all.meta || {}; all.meta.pinHash = await sha(nc + ':' + pin); }
  await DB.set(`ws/${nc}`, all);
  await DB.remove(`ws/${S.code}`);
  sessionStorage.setItem('wsAdmin', JSON.stringify({ code: nc, pin }));
  localStorage.setItem('wsLastCode', nc);
  unsubs.forEach(f => f()); unsubs = [];
  S.code = nc; S.meta = all.meta; S.groups = all.groups || {};
  connect(nc); renderAdmin(); toast('코드를 변경했어요. QR을 다시 안내해 주세요');
}

async function setGroupCount(n) {
  const gs = glist();
  if (n === gs.length) return toast('이미 그 개수예요');
  if (n > gs.length) {
    for (let i = gs.length; i < n; i++) await saveGroup(uid('g'), (i + 1) + '분임', []);
  } else {
    const kill = gs.slice(n);
    if (!confirm(`뒤쪽 ${kill.length}개 분임(${kill.map(g => g.name).join(', ')})을 삭제할까요?\n작성한 내용도 함께 지워집니다.`)) return;
    for (const g of kill) { await DB.remove(ws('groups/' + g.id)); await DB.remove(ws('docs/' + g.id)); await DB.remove(ws('notes/' + g.id)); await DB.remove(ws('cats/' + g.id)); }
  }
  S.groups = (await DB.get(ws('groups'))) || {};
  renderAdmin(); toast(`분임을 ${n}개로 맞췄어요`);
}

/* ---------- ② 분임 구성 ---------- */
function parseNames(str) {
  return String(str).split(/[\n,，、]+/).map(s => s.trim()).filter(Boolean)
    .map(s => s.startsWith('*') ? { name: s.slice(1).trim(), leader: true } : { name: s, leader: false }).filter(x => x.name);
}
async function saveGroup(gid, name, names, topic) {
  const old = S.groups[gid] || {}, byName = {}; Object.entries(old.members || {}).forEach(([id, m]) => byName[m.name] = id);
  const members = {}; let leader = '';
  names.forEach((n, i) => { const id = byName[n.name] || uid('m'); members[id] = { name: n.name, o: i }; if (n.leader && !leader) leader = id; });
  if (!leader && old.leader && members[old.leader]) leader = old.leader;
  const order = old.order != null ? old.order : (Math.max(0, ...glist().map(g => g.order || 0)) + 1);
  const upd = { name, members, leader, order, status: old.status || 'open' };
  if (topic !== undefined && topic !== (old.topic || '')) { upd.topic = topic; upd.topicBy = 'admin'; }
  await DB.update(ws('groups/' + gid), upd);
}

    let names = parseNames($('#dnames').value).map(x => x.name);
    const n = Math.max(1, +$('#dn').value || 1);
    if (!names.length) return toast('명단을 입력하세요');
    if (!confirm(`${names.length}명을 ${n}개 분임으로 배부할까요?\n기존 분임의 구성원 명단은 새로 덮어씁니다.`)) return;
    if ($('#dshuf').checked) names = names.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    const buckets = Array.from({ length: n }, () => []);
    names.forEach((nm, i) => buckets[i % n].push(nm));
    const cur = glist();
    for (let i = 0; i < n; i++) {
      const gid = cur[i] ? cur[i].id : uid('g');
      const nm = cur[i] ? cur[i].name : (i + 1) + '분임';
      const list = buckets[i].map((x, j) => ({ name: x, leader: $('#dlead').checked && j === 0 }));
      await saveGroup(gid, nm, list);
      S.groups = (await DB.get(ws('groups'))) || {};
    }
    if (cur.length > n && confirm(`남는 분임 ${cur.length - n}개를 삭제할까요?`)) {
      for (const g of cur.slice(n)) { await DB.remove(ws('groups/' + g.id)); await DB.remove(ws('docs/' + g.id)); await DB.remove(ws('notes/' + g.id)); await DB.remove(ws('cats/' + g.id)); }
      S.groups = (await DB.get(ws('groups'))) || {};
    }
    renderAdmin(); toast('명단을 배부했어요');
  };
  $('#bulkBtn').onclick = async () => {
    const lines = $('#bulk').value.split('\n').map(s => s.trim()).filter(Boolean); if (!lines.length) return toast('내용을 입력하세요');
    for (const ln of lines) {
      const i = ln.search(/[:：]/); const name = (i < 0 ? ln : ln.slice(0, i)).trim(), names = parseNames(i < 0 ? '' : ln.slice(i + 1));
      if (!name) continue; const ex = glist().find(g => g.name === name); await saveGroup(ex ? ex.id : uid('g'), name, names);
      S.groups = (await DB.get(ws('groups'))) || {};
    }
    toast('분임을 만들었어요'); renderAdmin();
  };
  $('#addG').onclick = async () => { await saveGroup(uid('g'), (glist().length + 1) + '분임', []); S.groups = (await DB.get(ws('groups'))) || {}; renderAdmin(); };
  $$('[data-save]', b).forEach(btn => btn.onclick = async () => {
    const c = btn.closest('[data-gc]'), gid = btn.dataset.save, name = $('.gn', c).value.trim();
    if (!name) return toast('분임명을 입력하세요');
    await saveGroup(gid, name, parseNames($('.gm', c).value), $('.gt', c).value.trim());
    S.groups = (await DB.get(ws('groups'))) || {}; toast('저장했어요 ✓');
  });
  $$('[data-del]', b).forEach(btn => btn.onclick = async () => {
    const g = S.groups[btn.dataset.del]; if (!confirm(`"${g.name}" 분임을 삭제할까요? 작성한 내용도 함께 지워져요.`)) return;
    await DB.remove(ws('groups/' + btn.dataset.del)); await DB.remove(ws('docs/' + btn.dataset.del)); await DB.remove(ws('notes/' + btn.dataset.del)); await DB.remove(ws('cats/' + btn.dataset.del));
    S.groups = (await DB.get(ws('groups'))) || {}; renderAdmin();
  });
  const move = async (gid, d) => {
    const gs2 = glist(), i = gs2.findIndex(g => g.id === gid), j = i + d;
    if (i < 0 || j < 0 || j >= gs2.length) return;
    const a = gs2[i], c = gs2[j];
    await DB.update(ws('groups/' + a.id), { order: j }); await DB.update(ws('groups/' + c.id), { order: i });
    S.groups = (await DB.get(ws('groups'))) || {}; renderAdminBody();
  };
  $$('[data-up]', b).forEach(btn => btn.onclick = () => move(btn.dataset.up, -1));
  $$('[data-dn]', b).forEach(btn => btn.onclick = () => move(btn.dataset.dn, 1));
}

}

  ${gs.length ? gs.map((g, i) => {
    const done = g.status === 'done', roles = g.roles || {}, ms = mlist(g);
    const rn = id => { const m = ms.find(x => x.id === id); return m ? m.name : '-'; };
    return `<div class="srow">
      <div class="info">
        <div class="card-h" style="margin:0">
          <div><label class="chk" style="display:inline-flex;border:0;background:none;padding:0;margin:0">
            <input type="checkbox" class="selg" value="${g.id}" ${S.sel[g.id] ? 'checked' : ''}>
            <b>${i + 1}. ${esc(g.name)}</b></label></div>
          <span class="badge ${done ? 'ok' : 'live'}">${done ? '완료' : '토론 중'}</span>
        </div>
        <div class="mu">${esc(membersText(g) || '구성원 없음')}</div>
        <div style="font-size:.95em;margin-top:2px">주제 · <b>${esc(g.topic || '미정')}</b></div>
        <div class="mu">기록 ${esc(rn(roles.note))} · 발표 ${esc(rn(roles.pres))} · 포스트잇 ${noteList(g.id).length}장 · <span id="ag-${g.id}">-</span></div>
        <div class="bar"><i id="bar-${g.id}" class="${done ? 'ok' : ''}" style="width:${done ? 100 : 4}%"></i></div>
      </div>
      <div class="btnrow" data-g="${g.id}">
        <button data-a="enter">방 열기</button>
        <button data-a="present">발표</button>
        <button class="sm" data-a="pdf">PDF</button>
        <button class="sm" data-a="hwpx">HWPX</button>
        ${done ? '<button class="warn sm" data-a="reopen">다시 열기</button>' : '<button class="sm" data-a="done">완료 처리</button>'}
      </div>
    </div>`;
  }).join('') : '<div class="card mu">먼저 ② 분임 구성에서 분임을 만들어 주세요.</div>'}`;

  const ids = gs.map(g => g.id);
  const selected = () => $$('.selg', b).filter(c => c.checked).map(c => c.value);
  $$('.selg', b).forEach(c => c.onchange = () => { S.sel[c.value] = c.checked; });
  $('#pAll').onclick = () => openPresent(ids, 0);
  $('#pDone').onclick = () => openPresent(gs.filter(g => g.status === 'done').map(g => g.id), 0);
  $('#pSel').onclick = () => { const s = selected(); if (!s.length) return toast('발표할 분임을 선택하세요'); openPresent(s, 0); };
  $('#pdfAll').onclick = () => exportPdf(selected().length ? selected() : ids);
  $('#hwpxAll').onclick = () => exportHwpx(selected().length ? selected() : ids);
  $$('[data-a]', b).forEach(btn => btn.onclick = async () => {
    const gid = btn.parentElement.dataset.g, a = btn.dataset.a;
    if (a === 'enter') { S.gid = gid; S.me = { id: 'admin', name: '관리자' }; renderRoom(); }
    if (a === 'present') openPresent(ids, ids.indexOf(gid));
    if (a === 'pdf') exportPdf([gid]);
    if (a === 'hwpx') exportHwpx([gid]);
    if (a === 'reopen') DB.update(ws('groups/' + gid), { status: 'open' });
    if (a === 'done') DB.update(ws('groups/' + gid), { status: 'done', doneAt: Date.now() });
  });
  if (ids.length) fetchDocs(ids).then(docs => {
    if (S.view !== 'admin' || S.tab !== 'status') return;
    let total = 0;
    ids.forEach(id => {
      const d = docs[id], len = textOf(d && d.html).length, g = S.groups[id] || {};
      total += len;
      const bar = $('#bar-' + id), ag = $('#ag-' + id);
      if (bar) bar.style.width = (g.status === 'done' ? 100 : Math.max(4, Math.min(96, Math.round(len / 500 * 100)))) + '%';
      if (ag) ag.textContent = `${len}자${d && d.summary ? ' · 요약 작성됨' : ''} · ${d && d.editorTs ? fmtAgo(d.editorTs) + ' 수정' : '작성 전'}`;
    });
    const k = $('#kChars'); if (k) k.innerHTML = total.toLocaleString() + '<small>자</small>';
  });
}

/* ===================== 발표 스테이지 ===================== */
const P = {
  open: false, ids: [], i: 0, size: parseInt(localStorage.getItem('wsPs')) || 30, unsub: null, doc: null,
  sumOnly: false, theme: localStorage.getItem('wsPtheme') || 'dark',
  t: { mins: parseInt(localStorage.getItem('wsPmin')) || 3, endsAt: null, paused: true, remain: 0 }
};
function openPresent(ids, i) {
  if (!ids || !ids.length) return toast('발표할 분임이 없어요');
  P.ids = ids; P.i = Math.max(0, i || 0); P.open = true; P.sumOnly = false;
  document.body.classList.add('noscroll');
  const el = $('#present'); el.hidden = false;
  el.classList.toggle('light', P.theme === 'light');
  el.innerHTML = `
  <div class="pbar">
    <button id="pp">◀ 이전</button><span class="cnt" id="pc"></span><button id="pn">다음 ▶</button>
    <span class="sep"></span>
    <span class="ptimer" id="ptimer">${fmtClock(P.t.mins * 60000)}</span>
    <button id="tgo">▶ 시작</button><button id="trs">↺</button>
    <select id="tmin" title="발표 제한 시간">${[1, 2, 3, 5, 7, 10, 15].map(n => `<option value="${n}" ${n === P.t.mins ? 'selected' : ''}>${n}분</option>`).join('')}</select>
    <span class="sp"></span>
    <button id="ps">요약만</button>
    <button id="pth" title="발표 배경 밝게/어둡게 (T)">${P.theme === 'light' ? '🌙 어둡게' : '☀️ 밝게'}</button>
    <button id="fm">A−</button><button id="fp">A+</button>
    <button id="ff">전체화면</button>
    <button id="pf">PDF</button><button id="ph">HWPX</button>
    <button id="px">닫기 ✕</button>
  </div>
  <div class="pdots" id="pdots"></div>
  <div class="pbody" id="pbody"></div>
  <div class="pfoot">
    <span class="pbrand">생각 모아 <em>봄</em></span>
    <span>발표 <b id="fnow">-</b></span><span>다음 <b id="fnext">-</b></span>
    <span class="sp"></span>
    <span>← → 이동 · Space 타이머 · S 요약 · T 배경 · F 전체화면 · Esc 닫기</span>
  </div>`;
  $('#pp').onclick = () => goP(-1); $('#pn').onclick = () => goP(1);
  $('#fm').onclick = () => sizeP(-3); $('#fp').onclick = () => sizeP(3);
  $('#ps').onclick = toggleSumOnly;
  $('#pth').onclick = togglePTheme;
  $('#ff').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen && el.requestFullscreen(); };
  $('#pf').onclick = () => exportPdf([P.ids[P.i]]);
  $('#ph').onclick = () => exportHwpx([P.ids[P.i]]);
  $('#px').onclick = closePresent;
  $('#tgo').onclick = togglePresentTimer;
  $('#trs').onclick = resetPresentTimer;
  $('#tmin').onchange = e => { P.t.mins = +e.target.value; localStorage.setItem('wsPmin', P.t.mins); resetPresentTimer(); };
  resetPresentTimer(); watchP();
}
function watchP() {
  if (P.unsub) P.unsub(); P.doc = null;
  P.unsub = DB.watch(ws('docs/' + P.ids[P.i]), v => { P.doc = v; paintPresent(); });
  paintPresent();
}
function goP(d) {
  const n = P.i + d; if (n < 0 || n >= P.ids.length) return;
  P.i = n; resetPresentTimer(); watchP(); const b = $('#pbody'); if (b) b.scrollTop = 0;
}
function sizeP(d) { P.size = Math.min(80, Math.max(14, P.size + d)); localStorage.setItem('wsPs', P.size); paintPresent(); }
function togglePTheme() {
  P.theme = P.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('wsPtheme', P.theme);
  const el = $('#present');
  if (el) el.classList.toggle('light', P.theme === 'light');
  const b = $('#pth');
  if (b) b.textContent = P.theme === 'light' ? '🌙 어둡게' : '☀️ 밝게';
  toast(P.theme === 'light' ? '밝은 배경으로 바꿨어요' : '어두운 배경으로 바꿨어요');
}
function toggleSumOnly() { P.sumOnly = !P.sumOnly; const b = $('#ps'); if (b) b.classList.toggle('on', P.sumOnly); paintPresent(); }
function resetPresentTimer() { P.t.endsAt = null; P.t.paused = true; P.t.remain = P.t.mins * 60000; const g = $('#tgo'); if (g) g.textContent = '▶ 시작'; tickPresentTimer(); }
function togglePresentTimer() {
  if (P.t.paused) { P.t.endsAt = Date.now() + (P.t.remain || P.t.mins * 60000); P.t.paused = false; $('#tgo').textContent = '⏸ 정지'; }
  else { P.t.remain = Math.max(0, P.t.endsAt - Date.now()); P.t.paused = true; $('#tgo').textContent = '▶ 계속'; }
  tickPresentTimer();
}
function tickPresentTimer() {
  const el = $('#ptimer'); if (!el) return;
  const left = P.t.paused ? (P.t.remain || 0) : Math.max(0, P.t.endsAt - Date.now());
  el.textContent = left <= 0 ? '시간 종료' : fmtClock(left);
  el.className = 'ptimer ' + (left <= 0 ? 'end' : (P.t.paused ? '' : 'run'));
}
function paintPresent() {
  if (!P.open) return;
  const g = S.groups[P.ids[P.i]], b = $('#pbody'); if (!b) return;
  if (!g) return closePresent();
  b.style.setProperty('--ps', P.size + 'px');
  b.classList.toggle('sumonly', P.sumOnly);
  $('#pc').textContent = `${P.i + 1} / ${P.ids.length}`;
  $('#pp').disabled = P.i === 0; $('#pn').disabled = P.i === P.ids.length - 1;
  $('#pdots').innerHTML = P.ids.map((id, k) => `<i class="${k === P.i ? 'on' : ((S.groups[id] || {}).status === 'done' ? 'done' : '')}"></i>`).join('');
  const nx = S.groups[P.ids[P.i + 1]];
  $('#fnow').textContent = g.name; $('#fnext').textContent = nx ? nx.name : '마지막 발표';
  const roles = g.roles || {}, ms = mlist(g), pres = ms.find(m => m.id === roles.pres);
  const sum = (P.doc && P.doc.summary) || '';
  const top = b.scrollTop;
  b.innerHTML = `
    <div class="pname"><h1>${esc(g.name)}</h1>
      ${g.status === 'done' ? '<span class="badge ok">완료</span>' : '<span class="badge live">토론 중</span>'}
      ${pres ? `<span class="badge">발표 ${esc(pres.name)}</span>` : ''}
    </div>
    <div class="pm">${esc(membersText(g) || '구성원 없음')} · ${esc(S.meta.title)}</div>
    ${g.topic ? `<div class="pt">주제 · ${esc(g.topic)}</div>` : ''}
    ${sum ? `<div class="psum">${nl2(sum)}</div>` : (P.sumOnly ? '<div class="psum">작성된 발표 요약이 없어요. (작업실의 “발표 요약”에 입력하면 여기 크게 표시됩니다)</div>' : '')}
    <div class="doc">${clean(P.doc && P.doc.html) || '<span class="nodoc">(작성된 내용이 없어요)</span>'}</div>`;
  b.scrollTop = top;
  tickPresentTimer();
}
function closePresent() {
  P.open = false; if (P.unsub) P.unsub(); P.unsub = null;
  if (document.fullscreenElement) document.exitFullscreen();
  $('#present').hidden = true; $('#present').innerHTML = '';
  document.body.classList.remove('noscroll');
}
document.addEventListener('keydown', e => {
  if (!$('#stage').hidden && e.key === 'Escape') return closeStage();
  if (!P.open) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') goP(1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goP(-1);
  else if (e.key === 'Escape') closePresent();
  else if (e.key === ' ') { e.preventDefault(); togglePresentTimer(); }
  else if (e.key === 's' || e.key === 'S') toggleSumOnly();
  else if (e.key === 'f' || e.key === 'F') $('#ff').click();
  else if (e.key === 't' || e.key === 'T') togglePTheme();
});

/* ===================== 저장: PDF(인쇄) / HWPX ===================== */
async function fetchDocs(ids) {
  const out = {}; await Promise.all(ids.map(async id => { out[id] = await DB.get(ws('docs/' + id)); })); return out;
}
async function exportPdf(ids) {
  const docs = await fetchDocs(ids);
  $('#printArea').innerHTML = ids.map((id, i) => {
    const g = S.groups[id] || {}, d = docs[id] || {};
    return `<section class="pr">
      <div class="hd"><span>${BRAND} · ${esc(S.meta.title)}</span><span>${esc(g.name)} · ${ids.length > 1 ? (i + 1) + ' / ' + ids.length : fmtT(Date.now())}</span></div>
      <h2>${esc(g.name)}</h2>
      <div class="pr-mem">${esc(membersText(g) || '')}</div>
      ${g.topic ? `<div class="pr-topic">주제 · ${esc(g.topic)}</div>` : ''}
      ${d.summary ? `<div class="pr-sum"><b>발표 요약</b>\n${esc(d.summary)}</div>` : ''}
      <div class="doc">${clean(d.html) || '(작성된 내용이 없습니다)'}</div>
    </section>`;
  }).join('');
  const old = document.title;
  document.title = `${S.meta.title}_${ids.length === 1 ? (S.groups[ids[0]] || {}).name : '전체'}`;
  document.body.classList.add('printing');
  toast('인쇄 창에서 "PDF로 저장"을 선택하면 파일로 저장돼요');
  setTimeout(() => { window.print(); document.title = old; }, 500);
}
window.addEventListener('afterprint', () => { document.body.classList.remove('printing'); $('#printArea').innerHTML = ''; });

function blocksFromHtml(html) {
  const root = document.createElement('div'); root.innerHTML = clean(html);
  const blocks = []; let cur = null;
  const flush = () => { if (cur) { const t = cur.runs.map(r => r.t).join('').trim(); if (t) { cur.runs[0].t = cur.runs[0].t.replace(/^\s+/, ''); blocks.push(cur); } } cur = null; };
  const add = (t, b) => { if (!cur) cur = { type: 'p', runs: [] }; cur.runs.push({ t, b }); };
  const boldEl = n => /^(b|strong|th)$/.test(n.tagName.toLowerCase()) || /bold|[6-9]00/.test(n.style.fontWeight || '');
  function cellText(td) { return (td.innerText || td.textContent || '').replace(/\s*\n\s*/g, ' ').trim(); }
  (function walk(node, bold) {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) { const t = n.textContent.replace(/\s+/g, ' '); if (t.trim() || cur) add(t, bold); return; }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if (tag === 'br') { flush(); return; }
      if (tag === 'table') { flush(); blocks.push({ type: 'tbl', rows: [...n.rows].map(tr => [...tr.cells].map(td => ({ t: cellText(td), b: td.tagName === 'TH' }))) }); return; }
      if (tag === 'img') { flush(); blocks.push({ type: 'p', runs: [{ t: '[그림 — PDF 저장본에서 확인하세요]', b: false }] }); return; }
      if (tag === 'ul' || tag === 'ol') { flush(); let k = 1; [...n.children].forEach(li => { if (li.tagName.toLowerCase() !== 'li') return; cur = { type: 'p', runs: [{ t: tag === 'ul' ? '• ' : (k++) + '. ', b: false }] }; walk(li, bold); flush(); }); return; }
      if (/^(p|div|h[1-6]|blockquote|li)$/.test(tag)) { flush(); walk(n, bold || /^h[1-6]$/.test(tag) || boldEl(n)); flush(); return; }
      walk(n, bold || boldEl(n));
    });
  })(root, false); flush();
  return blocks;
}
async function exportHwpx(ids) {
  if (!window.JSZip || !window.HWPX) return toast('저장 라이브러리를 불러오지 못했어요 (인터넷 확인)');
  try {
    const docs = await fetchDocs(ids);
    const data = {
      title: S.meta.title,
      groups: ids.map(id => {
        const g = S.groups[id] || {}, d = docs[id] || {};
        let blocks = [];
        if (d.summary) {
          blocks.push({ type: 'p', runs: [{ t: '[발표 요약]', b: true }] });
          String(d.summary).split('\n').forEach(ln => { if (ln.trim()) blocks.push({ type: 'p', runs: [{ t: ln.trim(), b: false }] }); });
          blocks.push({ type: 'p', runs: [{ t: ' ', b: false }] });
        }
        blocks = blocks.concat(blocksFromHtml(d.html));
        return { name: g.name, members: membersText(g), topic: g.topic || '', blocks };
      })
    };
    const zip = await HWPX.buildHwpx(JSZip, window.HWPX_TEMPLATE_B64, data);
    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/hwp+zip', compression: 'DEFLATE' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${S.meta.title}_${ids.length === 1 ? (S.groups[ids[0]] || {}).name : '전체'}.hwpx`.replace(/[\\/:*?"<>|]/g, '_');
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('HWPX 파일을 저장했어요 (그림은 PDF로 확인)');
  } catch (e) { console.error(e); toast('HWPX 저장 중 오류가 났어요'); }
}

window.addEventListener('popstate', () => { closePresent(); start(); });
start();
</script>
